<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Amnis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://unpkg.com/vis-network@9.1.6/dist/vis-network.min.js"></script>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}

:root{
  --bg:#050508;
  --bg-warm:#08080d;
  --surface-0:rgba(255,255,255,0.02);
  --surface-1:rgba(255,255,255,0.04);
  --surface-2:rgba(255,255,255,0.06);
  --surface-3:rgba(255,255,255,0.09);
  --surface-hover:rgba(255,255,255,0.08);

  --border-faint:rgba(255,255,255,0.06);
  --border-subtle:rgba(255,255,255,0.08);
  --border-default:rgba(255,255,255,0.1);
  --border-strong:rgba(255,255,255,0.16);
  --border-accent:rgba(139,92,246,0.4);

  --ink-primary:rgba(255,255,255,0.93);
  --ink-secondary:rgba(255,255,255,0.55);
  --ink-tertiary:rgba(255,255,255,0.32);
  --ink-placeholder:rgba(255,255,255,0.2);

  --accent:#8b5cf6;
  --accent-glow:rgba(139,92,246,0.15);
  --accent-hover:#a78bfa;
  --accent-ring:rgba(139,92,246,0.25);

  --emerald:#34d399;
  --emerald-glow:rgba(52,211,153,0.12);
  --sky:#38bdf8;
  --sky-glow:rgba(56,189,248,0.12);
  --amber:#fbbf24;
  --amber-glow:rgba(251,191,36,0.12);
  --rose:#f472b6;
  --rose-glow:rgba(244,114,182,0.12);
  --red:#f87171;
  --red-glow:rgba(248,113,113,0.12);
  --slate:#94a3b8;

  --cat-preference:#fbbf24;
  --cat-fact:#34d399;
  --cat-event:#38bdf8;
  --cat-procedure:#a78bfa;
  --cat-concept:#f472b6;
  --cat-meta:#64748b;
  --cat-general:#94a3b8;

  --font-sans:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
  --font-mono:'JetBrains Mono','SF Mono',monospace;

  --ease:cubic-bezier(0.16,1,0.3,1);
  --ease-spring:cubic-bezier(0.34,1.56,0.64,1);
  --dur-fast:120ms;
  --dur:200ms;
  --dur-slow:350ms;

  --radius:12px;
  --radius-sm:8px;
  --radius-xs:6px;
}

html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
::selection{background:var(--accent-glow);color:var(--accent-hover)}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.08);border-radius:10px}
::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.14)}

body{
  font-family:var(--font-sans);font-size:14px;line-height:1.5;
  color:var(--ink-primary);background:var(--bg);
  height:100vh;overflow:hidden;
  display:flex;flex-direction:column;
}

/* ─── Ambient Background ─── */
.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;
  background:
    radial-gradient(ellipse 80% 50% at 20% 0%,rgba(139,92,246,0.06),transparent),
    radial-gradient(ellipse 60% 40% at 80% 100%,rgba(56,189,248,0.04),transparent),
    radial-gradient(ellipse 50% 30% at 50% 50%,rgba(244,114,182,0.02),transparent);
}
.ambient::after{
  content:'';position:absolute;inset:0;
  background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.015'/%3E%3C/svg%3E");
  opacity:0.5;
}

/* ─── App Shell ─── */
#app{position:relative;z-index:1;display:flex;flex-direction:column;height:100vh}

/* ─── Header ─── */
header{
  display:flex;align-items:center;gap:16px;
  padding:0 24px;height:56px;flex-shrink:0;
  background:rgba(5,5,8,0.8);
  backdrop-filter:blur(20px) saturate(1.5);
  -webkit-backdrop-filter:blur(20px) saturate(1.5);
  border-bottom:1px solid var(--border-faint);
  z-index:100;
}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{
  width:28px;height:28px;border-radius:8px;
  background:linear-gradient(135deg,var(--accent),#c084fc);
  display:flex;align-items:center;justify-content:center;
  font-size:14px;box-shadow:0 0 20px rgba(139,92,246,0.3);
}
.logo h1{font-size:18px;font-weight:700;letter-spacing:-0.02em}
.logo h1 span{
  background:linear-gradient(135deg,var(--accent),var(--rose));
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo .subtitle{
  font-size:10px;font-weight:500;color:var(--ink-tertiary);
  text-transform:uppercase;letter-spacing:0.08em;
}

nav{display:flex;gap:2px;margin-left:auto;background:var(--surface-1);border-radius:10px;padding:3px}
nav button{
  background:none;border:none;color:var(--ink-secondary);
  padding:6px 14px;font-size:13px;font-weight:500;
  cursor:pointer;border-radius:7px;
  font-family:inherit;transition:all var(--dur) var(--ease);
  position:relative;white-space:nowrap;
}
nav button:hover{color:var(--ink-primary);background:var(--surface-hover)}
nav button.active{color:white;background:var(--accent);box-shadow:0 0 16px rgba(139,92,246,0.25)}

/* ─── Main ─── */
main{flex:1;display:flex;overflow:hidden}
.tab-content{
  display:none;flex:1;padding:24px;overflow-y:auto;
  animation:fadeIn var(--dur-slow) var(--ease);
}
.tab-content.active{display:flex;flex-direction:column}
.tab-content#tab-dashboard{overflow:hidden}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ─── Dashboard Stats ─── */
.stats-grid{
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:14px;margin-bottom:20px;flex-shrink:0;
}
@media(max-width:1100px){.stats-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.stats-grid{grid-template-columns:repeat(2,1fr);gap:10px}}

.stat-card{
  position:relative;overflow:hidden;
  background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:20px;
  transition:all var(--dur) var(--ease);
}
.stat-card:hover{border-color:var(--border-strong);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.3)}
.stat-card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:2px;
  border-radius:var(--radius) var(--radius) 0 0;
}
.stat-card.memory::before{background:linear-gradient(90deg,var(--emerald),#6ee7b7)}
.stat-card.rag::before{background:linear-gradient(90deg,var(--sky),#7dd3fc)}
.stat-card.wiki::before{background:linear-gradient(90deg,var(--accent),#c4b5fd)}
.stat-card.categories::before{background:linear-gradient(90deg,var(--amber),#fcd34d)}
.stat-card .stat-glow{
  position:absolute;top:-20px;right:-20px;width:80px;height:80px;
  border-radius:50%;filter:blur(30px);opacity:0.4;pointer-events:none;
}
.stat-card.memory .stat-glow{background:var(--emerald)}
.stat-card.rag .stat-glow{background:var(--sky)}
.stat-card.wiki .stat-glow{background:var(--accent)}
.stat-card.categories .stat-glow{background:var(--amber)}

.stat-card .stat-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.stat-card .stat-label{font-size:11px;font-weight:600;color:var(--ink-tertiary);text-transform:uppercase;letter-spacing:0.08em}
.stat-card .stat-icon{font-size:16px;opacity:0.6}
.stat-card .value{font-size:32px;font-weight:800;line-height:1;letter-spacing:-0.03em}
.stat-card.memory .value{color:var(--emerald)}
.stat-card.rag .value{color:var(--sky)}
.stat-card.wiki .value{color:var(--accent)}
.stat-card.categories .value{color:var(--amber)}
.stat-card .sub{font-size:11px;color:var(--ink-tertiary);margin-top:8px;line-height:1.4}

/* ─── Activity Panels ─── */
.activity-section{display:grid;grid-template-columns:1fr 1fr;gap:14px;flex:1;min-height:0;min-width:0}
@media(max-width:960px){.activity-section{grid-template-columns:1fr}}

.activity-panel{
  background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:16px;
  display:flex;flex-direction:column;min-height:0;min-width:0;overflow:hidden;
  transition:border-color var(--dur) var(--ease);
}
.activity-panel:hover{border-color:var(--border-default)}
.panel-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.panel-title{font-size:13px;font-weight:600;color:var(--ink-secondary)}
.panel-badge{font-size:10px;color:var(--ink-tertiary);background:var(--surface-2);padding:2px 8px;border-radius:10px}

/* Memory list */
.memory-list{list-style:none;flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:3px;min-width:0}
.memory-list li{
  padding:8px 12px;background:var(--surface-2);border:1px solid var(--border-faint);
  border-radius:var(--radius-xs);font-size:13px;cursor:pointer;
  transition:all var(--dur-fast) var(--ease);
  display:flex;align-items:center;gap:8px;min-width:0;
}
.memory-list li:hover{border-color:var(--border-accent);background:var(--surface-3);transform:translateX(2px)}

.cat-badge{
  display:inline-flex;align-items:center;padding:2px 7px;border-radius:4px;
  font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;
  flex-shrink:0;line-height:1.4;
}
.fact-text{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-primary)}
.importance-chip{font-size:11px;color:var(--ink-tertiary);flex-shrink:0;font-variant-numeric:tabular-nums}

/* Category chart */
.category-chart{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:6px}
.chart-bar-row{display:flex;align-items:center;gap:8px;min-width:0}
.chart-bar-label{font-size:11px;color:var(--ink-secondary);width:64px;flex-shrink:0;text-transform:capitalize;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.chart-bar-track{flex:1;min-width:30px;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.chart-bar-fill{height:100%;border-radius:3px;transition:width 600ms var(--ease)}
.chart-bar-count{font-size:11px;color:var(--ink-tertiary);min-width:22px;text-align:right;font-variant-numeric:tabular-nums;flex-shrink:0}

/* ─── Graph ─── */
#graph-container{
  flex:1;background:
    radial-gradient(ellipse at 30% 20%, rgba(139,92,246,0.04), transparent 60%),
    radial-gradient(ellipse at 70% 80%, rgba(56,189,248,0.03), transparent 60%),
    var(--surface-0);
  border:1px solid var(--border-subtle);
  border-radius:var(--radius);position:relative;overflow:hidden;
}
#graph-container::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(rgba(255,255,255,0.015) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.015) 1px, transparent 1px);
  background-size:40px 40px;
  z-index:0;
}
#graph-container canvas{border-radius:var(--radius)}
#graph-controls{
  position:absolute;top:12px;right:12px;z-index:10;
  display:flex;flex-direction:column;gap:4px;
}
#graph-controls button{
  background:rgba(5,5,8,0.85);backdrop-filter:blur(12px);
  border:1px solid var(--border-default);color:var(--ink-secondary);
  width:32px;height:32px;border-radius:50%;cursor:pointer;
  font-size:12px;font-weight:500;font-family:inherit;line-height:1;
  display:flex;align-items:center;justify-content:center;
  transition:all var(--dur-fast) var(--ease);
}
#graph-controls button:hover{background:var(--accent);color:white;border-color:var(--accent);box-shadow:0 0 16px rgba(139,92,246,0.3)}
#graph-legend{
  position:absolute;bottom:12px;left:12px;z-index:10;
  background:rgba(5,5,8,0.85);backdrop-filter:blur(12px) saturate(1.5);
  border:1px solid var(--border-default);border-radius:var(--radius-sm);
  padding:8px 12px;font-size:11px;display:flex;flex-direction:column;gap:3px;
}
.legend-item{display:flex;align-items:center;gap:8px;color:var(--ink-secondary)}
.legend-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.legend-box{width:8px;height:8px;border-radius:2px;flex-shrink:0}
.legend-square{width:8px;height:8px;flex-shrink:0;border-radius:1px}
.graph-empty{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
  text-align:center;color:var(--ink-tertiary);z-index:1;
}
.graph-empty .icon{font-size:36px;margin-bottom:8px;opacity:0.4}
.graph-empty .label{font-size:14px;margin-bottom:4px}
.graph-empty .hint{font-size:11px}

/* ─── Memories ─── */
.memories-toolbar{
  display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;align-items:center;
}
.memories-toolbar input,.memories-toolbar select{
  background:var(--surface-2);border:1px solid var(--border-default);
  color:var(--ink-primary);padding:8px 12px;border-radius:var(--radius-xs);
  font-size:13px;font-family:inherit;transition:all var(--dur-fast) var(--ease);
}
.memories-toolbar input::placeholder{color:var(--ink-placeholder)}
.memories-toolbar input{flex:1;min-width:180px}
.memories-toolbar input:focus,.memories-toolbar select:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring);
}
.memories-toolbar select{cursor:pointer}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:8px 14px;border-radius:var(--radius-xs);font-size:13px;font-weight:500;
  font-family:inherit;cursor:pointer;transition:all var(--dur-fast) var(--ease);
  border:1px solid transparent;white-space:nowrap;
}
.btn-primary{background:var(--accent);border-color:var(--accent);color:white}
.btn-primary:hover{background:var(--accent-hover);border-color:var(--accent-hover);box-shadow:0 0 20px rgba(139,92,246,0.3)}
.btn-secondary{background:var(--surface-2);border-color:var(--border-default);color:var(--ink-primary)}
.btn-secondary:hover{background:var(--surface-3);border-color:var(--border-strong)}
.btn-success{background:var(--emerald);border-color:var(--emerald);color:#052e16}
.btn-success:hover{box-shadow:0 0 20px rgba(52,211,153,0.3)}
.btn-danger{background:var(--red);border-color:var(--red);color:white}
.btn-ghost{background:transparent;border-color:transparent;color:var(--ink-secondary)}
.btn-ghost:hover{background:var(--surface-hover);color:var(--ink-primary)}
.btn-sm{padding:5px 10px;font-size:11px}
.btn-xs{padding:3px 8px;font-size:10px}

/* Memory Cards */
#memories-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.memory-card{
  background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:16px;cursor:pointer;
  transition:all var(--dur) var(--ease);
}
.memory-card:hover{border-color:var(--border-accent);transform:translateY(-2px);box-shadow:0 8px 32px rgba(0,0,0,0.25),0 0 0 1px var(--border-accent)}
.memory-card .card-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.memory-card .card-fact{
  font-size:13px;line-height:1.55;color:var(--ink-primary);
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;
}
.memory-card .card-meta{font-size:11px;color:var(--ink-tertiary);margin-top:8px}
.memory-card .card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.memory-card .card-tags span{background:var(--surface-2);padding:2px 7px;border-radius:4px;font-size:10px;color:var(--ink-tertiary)}
.memory-card .card-actions{margin-top:8px;display:flex;gap:4px}

/* ─── Search ─── */
.search-box{display:flex;gap:8px;margin-bottom:20px}
.search-box input{
  flex:1;background:var(--surface-2);border:1px solid var(--border-default);
  color:var(--ink-primary);padding:12px 16px;border-radius:var(--radius);
  font-size:15px;font-family:inherit;transition:all var(--dur-fast) var(--ease);
}
.search-box input::placeholder{color:var(--ink-placeholder)}
.search-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
#search-results{display:flex;flex-direction:column;gap:10px}
.search-result{
  background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:16px;
  transition:all var(--dur-fast) var(--ease);
}
.search-result:hover{border-color:var(--border-default);transform:translateX(2px)}
.search-result .result-source{font-size:11px;color:var(--ink-tertiary);margin-bottom:6px;font-family:var(--font-mono);word-break:break-all}
.search-result .result-content{font-size:13px;line-height:1.6;color:var(--ink-primary);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.search-result .result-score{font-size:11px;color:var(--emerald);margin-top:8px;font-variant-numeric:tabular-nums;font-weight:500}

/* ─── Wiki ─── */
.wiki-layout{display:flex;gap:14px;height:100%;min-height:0}
.wiki-sidebar{
  width:260px;flex-shrink:0;overflow-y:auto;
  background:var(--surface-1);border:1px solid var(--border-subtle);
  border-radius:var(--radius);padding:12px;
}
.wiki-sidebar input{
  width:100%;background:var(--surface-2);border:1px solid var(--border-default);
  color:var(--ink-primary);padding:8px 12px;border-radius:var(--radius-xs);
  font-size:13px;margin-bottom:10px;font-family:inherit;
  transition:all var(--dur-fast) var(--ease);
}
.wiki-sidebar input::placeholder{color:var(--ink-placeholder)}
.wiki-sidebar input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.wiki-page-list{list-style:none;display:flex;flex-direction:column;gap:2px}
.wiki-page-list li{
  padding:8px 10px;font-size:13px;cursor:pointer;border-radius:var(--radius-xs);
  transition:all var(--dur-fast) var(--ease);
  border-left:2px solid transparent;color:var(--ink-secondary);
}
.wiki-page-list li:hover{background:var(--surface-2);color:var(--ink-primary);border-left-color:var(--border-strong)}
.wiki-page-list li.active{background:var(--accent-glow);color:var(--accent-hover);border-left-color:var(--accent);font-weight:600}
.wiki-page-list li .page-summary{font-size:10px;color:var(--ink-tertiary);margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.wiki-content{
  flex:1;overflow-y:auto;background:var(--surface-1);
  border:1px solid var(--border-subtle);border-radius:var(--radius);
  padding:28px 32px;
}
.wiki-content h1{font-size:28px;font-weight:800;margin-bottom:16px;color:var(--accent);letter-spacing:-0.03em}
.wiki-content h2{font-size:20px;font-weight:700;margin:24px 0 10px;color:var(--ink-primary);letter-spacing:-0.01em}
.wiki-content h3{font-size:16px;font-weight:600;margin:16px 0 8px;color:var(--ink-primary)}
.wiki-content p{font-size:14px;line-height:1.7;margin-bottom:10px;color:var(--ink-secondary)}
.wiki-content blockquote{border-left:3px solid var(--accent);padding:10px 16px;margin:10px 0;background:var(--surface-2);font-size:13px;color:var(--ink-secondary);border-radius:0 var(--radius-xs) var(--radius-xs) 0}
.wiki-content ul{font-size:13px;color:var(--ink-secondary);padding-left:20px;line-height:1.7}
.wiki-content li{margin-bottom:4px}
.wiki-content code{background:var(--surface-2);padding:2px 6px;border-radius:4px;font-size:12px;font-family:var(--font-mono)}
.wiki-content a{color:var(--accent);text-decoration:none;border-bottom:1px solid transparent;transition:border-color var(--dur-fast)}
.wiki-content a:hover{border-bottom-color:var(--accent)}

.wiki-empty,.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:var(--ink-tertiary);text-align:center;gap:8px;padding:40px}
.wiki-empty .icon,.empty-state .icon{font-size:40px;opacity:0.3}
.wiki-empty .text,.empty-state .text{font-size:14px}
.wiki-empty .hint,.empty-state .hint{font-size:11px}

/* ─── Modal ─── */
.modal-overlay{
  display:none;position:fixed;inset:0;
  background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);z-index:1000;
  align-items:center;justify-content:center;
}
.modal-overlay.open{display:flex;animation:overlayIn var(--dur-fast) var(--ease)}
@keyframes overlayIn{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface-1);border:1px solid var(--border-default);
  border-radius:16px;padding:28px;width:520px;max-width:92vw;max-height:85vh;overflow-y:auto;
  box-shadow:0 24px 80px rgba(0,0,0,0.5);
  animation:modalIn var(--dur-slow) var(--ease-spring);
}
@keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(0.97)}to{opacity:1;transform:none}}
.modal .modal-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.modal .modal-header h2{font-size:18px;font-weight:700;letter-spacing:-0.01em;margin:0}
.modal h2{font-size:18px;font-weight:700;margin-bottom:20px;letter-spacing:-0.01em}
.modal label{display:block;font-size:11px;font-weight:600;color:var(--ink-secondary);margin:16px 0 4px;letter-spacing:0.05em;text-transform:uppercase}
.modal input,.modal textarea,.modal select{
  width:100%;background:var(--surface-2);border:1px solid var(--border-default);
  color:var(--ink-primary);padding:8px 12px;border-radius:var(--radius-xs);
  font-size:13px;font-family:inherit;transition:all var(--dur-fast) var(--ease);
}
.modal textarea{min-height:80px;resize:vertical}
.modal input:focus,.modal textarea:focus,.modal select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-ring)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}

/* ─── Toast ─── */
.toast-container{position:fixed;bottom:20px;right:20px;z-index:2000;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{
  background:rgba(5,5,8,0.9);backdrop-filter:blur(12px);
  border:1px solid var(--border-strong);color:var(--ink-primary);
  padding:10px 16px;border-radius:var(--radius-sm);font-size:13px;
  box-shadow:0 8px 32px rgba(0,0,0,0.4);
  opacity:0;transform:translateY(8px) scale(0.95);
  transition:all var(--dur) var(--ease);pointer-events:auto;
  display:flex;align-items:center;gap:8px;
}
.toast.show{opacity:1;transform:none}
.toast .toast-icon{
  width:20px;height:20px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:10px;flex-shrink:0;
}
.toast.success .toast-icon{background:var(--emerald-glow);color:var(--emerald)}
.toast.error .toast-icon{background:var(--red-glow);color:var(--red)}

/* ─── Detail Sections ─── */
.detail-section{margin-bottom:14px}
.detail-section:last-child{margin-bottom:0}
.detail-label{font-size:10px;font-weight:600;color:var(--ink-tertiary);text-transform:uppercase;letter-spacing:0.06em;margin-bottom:4px}
.detail-value{font-size:13px;color:var(--ink-primary);line-height:1.6}
.detail-meta{display:flex;gap:14px;flex-wrap:wrap}
.detail-meta-item{font-size:11px;color:var(--ink-tertiary)}
.detail-storage{font-size:11px;font-family:var(--font-mono);background:var(--surface-2);padding:8px 12px;border-radius:var(--radius-xs);color:var(--ink-secondary);line-height:1.5}
.detail-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.detail-tags span{background:var(--surface-2);padding:2px 7px;border-radius:4px;font-size:10px;color:var(--ink-tertiary)}
.context-box{background:var(--surface-2);padding:10px 12px;border-radius:var(--radius-xs);border:1px solid var(--border-faint);font-size:12px;color:var(--ink-secondary);line-height:1.5;max-height:200px;overflow-y:auto}

/* ─── Skeleton ─── */
.skeleton{
  background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 50%,var(--surface-2) 75%);
  background-size:200% 100%;animation:shimmer 1.5s ease-in-out infinite;border-radius:var(--radius-xs);
}
.skeleton-text{height:12px;width:100%;margin-bottom:6px;border-radius:4px}
.skeleton-text.w40{width:40%}.skeleton-text.w60{width:60%}.skeleton-text.w80{width:80%}
.skeleton-value{height:36px;width:50%;margin-bottom:4px}
.skeleton-block{height:48px;width:100%}
.skeleton-card{height:110px;border-radius:var(--radius)}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

/* ─── Responsive ─── */
@media(max-width:768px){
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .wiki-layout{flex-direction:column}
  .wiki-sidebar{width:100%;max-height:200px}
  #memories-list{grid-template-columns:1fr}
  header{flex-wrap:wrap;gap:8px;padding:8px 12px}
  nav{margin-left:0;width:100%;overflow-x:auto}
  nav button{flex-shrink:0}
  .modal{padding:20px;width:95vw}
}
</style>
</head>
<body>
<div class="ambient"></div>
<div id="app">
  <header>
    <div class="logo">
      <div class="logo-icon">🧠</div>
      <div>
        <h1><span>Amnis</span></h1>
        <div class="subtitle">Memory Graph</div>
      </div>
    </div>
    <nav>
      <button class="active" data-tab="dashboard">Dashboard</button>
      <button data-tab="graph">Graph</button>
      <button data-tab="memories">Memories</button>
      <button data-tab="search">Search</button>
      <button data-tab="wiki">Wiki</button>
    </nav>
  </header>

  <main>
    <!-- Dashboard -->
    <div id="tab-dashboard" class="tab-content active">
      <div class="stats-grid" id="stats-grid">
        <div class="stat-card memory">
          <div class="stat-glow"></div>
          <div class="stat-top"><span class="stat-label">Memories</span><span class="stat-icon">🧠</span></div>
          <div class="value" id="stat-memories"><div class="skeleton skeleton-value"></div></div>
          <div class="sub" id="stat-mem-avg"><div class="skeleton skeleton-text w60"></div></div>
        </div>
        <div class="stat-card rag">
          <div class="stat-glow"></div>
          <div class="stat-top"><span class="stat-label">RAG Chunks</span><span class="stat-icon">🔍</span></div>
          <div class="value" id="stat-chunks"><div class="skeleton skeleton-value"></div></div>
          <div class="sub" id="stat-sources"><div class="skeleton skeleton-text w40"></div></div>
        </div>
        <div class="stat-card wiki">
          <div class="stat-glow"></div>
          <div class="stat-top"><span class="stat-label">Wiki Pages</span><span class="stat-icon">📖</span></div>
          <div class="value" id="stat-wiki"><div class="skeleton skeleton-value"></div></div>
          <div class="sub" id="stat-embed"><div class="skeleton skeleton-text w80"></div></div>
        </div>
        <div class="stat-card categories">
          <div class="stat-glow"></div>
          <div class="stat-top"><span class="stat-label">Categories</span><span class="stat-icon">🏷️</span></div>
          <div class="value" id="stat-mem-by-cat"><div class="skeleton skeleton-value"></div></div>
          <div class="sub" id="stat-notes"><div class="skeleton skeleton-text w60"></div></div>
        </div>
      </div>
      <div class="activity-section">
        <div class="activity-panel">
          <div class="panel-header">
            <span class="panel-title">Recent Memories</span>
            <span class="panel-badge" id="recent-count"></span>
          </div>
          <ul class="memory-list" id="recent-memories">
            <li class="skeleton skeleton-block" style="border:none;margin-bottom:4px"></li>
            <li class="skeleton skeleton-block" style="border:none;margin-bottom:4px"></li>
            <li class="skeleton skeleton-block" style="border:none;margin-bottom:4px"></li>
          </ul>
        </div>
        <div class="activity-panel">
          <div class="panel-header"><span class="panel-title">Memory by Category</span></div>
          <div class="category-chart" id="category-chart">
            <div class="skeleton skeleton-block" style="margin-bottom:8px"></div>
            <div class="skeleton skeleton-block" style="margin-bottom:8px"></div>
          </div>
        </div>
      </div>
    </div>

    <!-- Graph -->
    <div id="tab-graph" class="tab-content">
      <div id="graph-container">
        <div id="graph-controls">
          <button onclick="fitGraph()" title="Fit">⊞</button>
          <button onclick="resetGraph()" title="Reset">⟲</button>
          <button onclick="refreshGraph()" title="Refresh">↻</button>
        </div>
        <div id="graph-legend">
          <div class="legend-item"><span class="legend-dot" style="background:var(--emerald)"></span> Memory</div>
          <div class="legend-item"><span class="legend-box" style="background:var(--accent)"></span> Wiki Page</div>
          <div class="legend-item"><span class="legend-square" style="background:var(--sky)"></span> Document</div>
        </div>
      </div>
    </div>

    <!-- Memories -->
    <div id="tab-memories" class="tab-content">
      <div class="memories-toolbar">
        <input type="text" id="mem-search" placeholder="Search memories..." onkeydown="if(event.key==='Enter')loadMemories()">
        <select id="mem-category">
          <option value="">All Categories</option>
          <option value="preference">Preference</option>
          <option value="fact">Fact</option>
          <option value="event">Event</option>
          <option value="procedure">Procedure</option>
          <option value="concept">Concept</option>
          <option value="meta">Meta</option>
        </select>
        <button class="btn btn-primary" onclick="loadMemories()">Search</button>
        <button class="btn btn-success" onclick="showNewMemoryModal()">+ New Memory</button>
      </div>
      <div id="memories-list">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>

    <!-- Search -->
    <div id="tab-search" class="tab-content">
      <div class="search-box">
        <input type="text" id="rag-query" placeholder="Ask anything in your notes..." onkeydown="if(event.key==='Enter')doSearch()">
        <button class="btn btn-primary" onclick="doSearch()">Search</button>
      </div>
      <div id="search-results"></div>
    </div>

    <!-- Wiki -->
    <div id="tab-wiki" class="tab-content">
      <div class="wiki-layout">
        <div class="wiki-sidebar">
          <input type="text" id="wiki-search" placeholder="Search wiki pages..." onkeydown="if(event.key==='Enter')loadWiki()">
          <ul class="wiki-page-list" id="wiki-page-list">
            <li class="skeleton skeleton-text" style="border:none;margin-bottom:6px"></li>
            <li class="skeleton skeleton-text w80" style="border:none;margin-bottom:6px"></li>
            <li class="skeleton skeleton-text" style="border:none;margin-bottom:6px"></li>
          </ul>
        </div>
        <div class="wiki-content" id="wiki-content">
          <div class="wiki-empty">
            <div class="icon">📖</div>
            <div class="text">Select a wiki page from the sidebar</div>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="toast-container" id="toast-container"></div>

<!-- New Memory Modal -->
<div class="modal-overlay" id="new-memory-modal">
  <div class="modal">
    <h2>New Memory</h2>
    <label>Fact</label>
    <textarea id="modal-fact" placeholder="What do you want to remember?"></textarea>
    <label>Category</label>
    <select id="modal-category">
      <option value="fact">Fact</option>
      <option value="preference">Preference</option>
      <option value="event">Event</option>
      <option value="procedure">Procedure</option>
      <option value="concept">Concept</option>
      <option value="meta">Meta</option>
      <option value="general">General</option>
    </select>
    <label>Importance (1-10)</label>
    <input type="number" id="modal-importance" value="5" min="1" max="10">
    <label>Tags (comma separated)</label>
    <input type="text" id="modal-tags" placeholder="e.g. writing, linux, setup">
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeNewMemoryModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveNewMemory()">Save</button>
    </div>
  </div>
</div>

<!-- Memory Detail Modal -->
<div class="modal-overlay" id="memory-detail-modal">
  <div class="modal" style="max-width:600px">
    <div class="modal-header">
      <h2>Memory Details</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeMemoryDetailModal()" style="font-size:16px">✕</button>
    </div>
    <div id="memory-detail-content">
      <div class="skeleton skeleton-block" style="margin-bottom:12px"></div>
      <div class="skeleton skeleton-text w80" style="margin-bottom:8px"></div>
      <div class="skeleton skeleton-text"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-secondary btn-sm" onclick="closeMemoryDetailModal()">Close</button>
      <button class="btn btn-ghost btn-sm" id="memory-detail-source-btn" onclick="" style="display:none">View Wiki Source</button>
      <button class="btn btn-primary btn-sm" id="memory-detail-edit-btn" onclick="editMemoryFromDetail()">Edit</button>
      <button class="btn btn-danger btn-sm" id="memory-detail-delete-btn" onclick="deleteMemoryFromDetail()">Delete</button>
    </div>
  </div>
</div>

<script>
// ─── State ───
let network = null;
let graphData = { nodes: [], edges: [] };
let currentTab = 'dashboard';
let currentMemoryId = null;

// ─── Toast ───
function showToast(msg, type) {
  type = type || 'success';
  const c = document.getElementById('toast-container');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.innerHTML = '<span class="toast-icon">' + (type === 'success' ? '✓' : '✕') + '</span>' + msg;
  c.appendChild(t);
  requestAnimationFrame(() => t.classList.add('show'));
  setTimeout(() => { t.classList.remove('show'); setTimeout(() => t.remove(), 250); }, 3000);
}

// ─── Escape HTML ───
function escapeHtml(t) { const d = document.createElement('div'); d.textContent = t; return d.innerHTML; }

// ─── Tab Navigation ───
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
    currentTab = btn.dataset.tab;
    if (currentTab === 'graph') setTimeout(initGraph, 100);
    if (currentTab === 'dashboard') loadDashboard();
    if (currentTab === 'memories') loadMemories();
    if (currentTab === 'wiki') loadWiki();
  });
});

// ─── Dashboard ───
async function loadDashboard() {
  try {
    const res = await fetch('/api/status');
    const data = await res.json();
    document.getElementById('stat-memories').textContent = data.memory.total_memories;
    document.getElementById('stat-mem-avg').textContent = 'avg importance: ' + data.memory.avg_importance;
    document.getElementById('stat-chunks').textContent = data.rag.total_chunks || 0;
    document.getElementById('stat-sources').textContent = 'sources: ' + (data.rag.unique_sources || 0);
    document.getElementById('stat-wiki').textContent = data.wiki.total_pages;
    document.getElementById('stat-embed').textContent = 'model: ' + data.config.embedding_model;
    document.getElementById('stat-mem-by-cat').textContent = Object.keys(data.memory.by_category || {}).length;
    document.getElementById('stat-notes').textContent = 'notes: ' + data.config.notes_dir.split('/').pop();

    const cats = data.memory.by_category || {};
    document.getElementById('recent-count').textContent = Object.keys(cats).length + ' types';

    const memRes = await fetch('/api/memories?limit=8');
    const memData = await memRes.json();
    const list = document.getElementById('recent-memories');
    list.innerHTML = '';
    (memData.memories || []).forEach(m => {
      const colors = {preference:'var(--cat-preference)',fact:'var(--cat-fact)',event:'var(--cat-event)',procedure:'var(--cat-procedure)',concept:'var(--cat-concept)',meta:'var(--cat-meta)',general:'var(--cat-general)'};
      const li = document.createElement('li');
      li.innerHTML = '<span class="cat-badge" style="background:' + (colors[m.category]||'var(--cat-general)') + '">' + m.category + '</span><span class="fact-text">' + m.fact + '</span><span class="importance-chip">' + m.importance + '/10</span>';
      li.addEventListener('click', () => showMemoryDetailModal(m.id));
      list.appendChild(li);
    });
    renderCategoryChart(cats);
  } catch (e) {
    document.getElementById('recent-memories').innerHTML = '<li style="color:var(--red)">Error loading</li>';
  }
}

function renderCategoryChart(byCategory) {
  const c = document.getElementById('category-chart');
  const entries = Object.entries(byCategory);
  if (!entries.length) { c.innerHTML = '<div class="empty-state"><div class="text">No memories yet</div></div>'; return; }
  const colors = {preference:'var(--cat-preference)',fact:'var(--cat-fact)',event:'var(--cat-event)',procedure:'var(--cat-procedure)',concept:'var(--cat-concept)',meta:'var(--cat-meta)',general:'var(--cat-general)'};
  const total = entries.reduce((s, e) => s + e[1], 0);
  let bars = '';
  for (const [cat, count] of entries) {
    const pct = (count / total) * 100;
    bars += '<div class="chart-bar-row"><span class="chart-bar-label">' + cat + '</span><div class="chart-bar-track"><div class="chart-bar-fill" style="width:' + pct + '%;background:' + (colors[cat]||'var(--cat-general)') + '"></div></div><span class="chart-bar-count">' + count + '</span></div>';
  }
  c.innerHTML = bars;
}

// ─── Graph ───
async function initGraph() {
  const container = document.getElementById('graph-container');
  if (!container) return;
  if (network) { network.destroy(); network = null; }
  container.innerHTML = '<div id="graph-controls"><button onclick="fitGraph()" title="Fit">⊞</button><button onclick="resetGraph()" title="Reset">⟲</button><button onclick="refreshGraph()" title="Refresh">↻</button></div><div id="graph-legend"><div class="legend-item"><span class="legend-dot" style="background:var(--emerald)"></span> Memory</div><div class="legend-item"><span class="legend-box" style="background:var(--accent)"></span> Wiki Page</div><div class="legend-item"><span class="legend-square" style="background:var(--sky)"></span> Document</div></div>';
  await new Promise(r => setTimeout(r, 50));
  await refreshGraph();
}

async function refreshGraph() {
  try {
    const res = await fetch('/api/graph');
    graphData = await res.json();
  } catch (e) {
    showToast('Error loading graph: ' + e.message, 'error');
    return;
  }
  if (!graphData.nodes || graphData.nodes.length === 0) {
    document.getElementById('graph-container').innerHTML += '<div class="graph-empty"><div class="icon">🕸️</div><div class="label">No graph data yet</div><div class="hint">Add memories and index your notes to see connections</div></div>';
    return;
  }
  const container = document.getElementById('graph-container');
  const options = {
    nodes: {
      font: { size: 10, color: 'rgba(255,255,255,0.7)', face: 'Inter', strokeWidth: 2, strokeColor: 'rgba(5,5,8,0.8)' },
      borderWidth: 0,
      borderWidthSelected: 2,
      scaling: { min: 14, max: 36 },
    },
    edges: {
      smooth: { type: 'dynamic' },
      arrows: { to: { enabled: false } },
      color: { color: 'rgba(255,255,255,0.04)', highlight: 'rgba(139,92,246,0.3)', hover: 'rgba(139,92,246,0.2)', inherit: false },
      width: 0.5,
      hoverWidth: 2,
      selectionWidth: 1.5,
    },
    physics: {
      solver: 'forceAtlas2Based',
      forceAtlas2Based: {
        gravitationalConstant: -60,
        centralGravity: 0.001,
        springLength: 200,
        springConstant: 0.005,
        damping: 0.5,
        avoidOverlap: 0.8,
      },
      stabilization: { iterations: 200, updateInterval: 50 },
      adaptiveTimestep: true,
    },
    interaction: {
      hover: true,
      tooltipDelay: 200,
      zoomView: true,
      dragView: true,
      hideEdgesOnDrag: true,
      hideEdgesOnZoom: true,
    },
    groups: {
      memory: {
        shape: 'dot',
        color: { background: '#34d399', border: '#6ee7b7', highlight: { background: '#6ee7b7', border: '#a7f3d0' } },
        font: { color: 'rgba(255,255,255,0.65)' },
        size: 20,
      },
      wiki: {
        shape: 'box',
        color: { background: '#8b5cf6', border: '#a78bfa', highlight: { background: '#a78bfa', border: '#c4b5fd' } },
        font: { color: 'rgba(255,255,255,0.9)', face: 'Inter', size: 11 },
        size: 24,
        shapeProperties: { borderRadius: 6 },
      },
      document: {
        shape: 'square',
        color: { background: '#38bdf8', border: '#7dd3fc', highlight: { background: '#7dd3fc', border: '#bae6fd' } },
        font: { color: 'rgba(255,255,255,0.65)' },
        size: 18,
      },
    },
  };
  try {
    network = new vis.Network(container, graphData, options);
    network.on('click', function(params) {
      if (params.nodes.length > 0) {
        const nodeId = params.nodes[0];
        const node = graphData.nodes.find(n => n.id === nodeId);
        if (node && node.data) {
          if (node.group === 'memory' && node.data.id) showMemoryDetailModal(node.data.id);
          else if (node.group === 'wiki' && node.data.id) showWikiDetailModal(node.data.id);
          else if (node.group === 'document' && node.data.title) showDocumentDetailModal(node.data.title, node.data);
          else showToast(node.group + ': ' + (node.data.fact || node.data.title || node.label));
        }
      }
    });
    network.on('stabilizationIterationsDone', () => network.fit());
  } catch (e) {
    showToast('Graph error: ' + e.message, 'error');
  }
}
function fitGraph() { if (network) network.fit(); }
function resetGraph() { if (network) { network.setData(graphData); network.fit(); } }

// ─── Memories ───
async function loadMemories() {
  const query = document.getElementById('mem-search').value;
  const category = document.getElementById('mem-category').value;
  let url = '/api/memories?limit=100';
  if (query) url += '&query=' + encodeURIComponent(query);
  if (category) url += '&category=' + encodeURIComponent(category);
  try {
    const res = await fetch(url);
    const data = await res.json();
    const container = document.getElementById('memories-list');
    container.innerHTML = '';
    if (!data.memories || data.memories.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🧠</div><div class="text">No memories found</div><div class="hint">Create one with the + New Memory button</div></div>';
      return;
    }
    const colors = {preference:'var(--cat-preference)',fact:'var(--cat-fact)',event:'var(--cat-event)',procedure:'var(--cat-procedure)',concept:'var(--cat-concept)',meta:'var(--cat-meta)',general:'var(--cat-general)'};
    data.memories.forEach(m => {
      const card = document.createElement('div');
      card.className = 'memory-card';
      const source = m.source || '—';
      const isWikiSource = source.includes('wiki') || source.includes('Wiki');
      const isDocSource = source.includes('/') || source.includes('\\') || source.endsWith('.md') || source.endsWith('.txt');
      card.innerHTML = '<div class="card-header"><span class="cat-badge" style="background:' + (colors[m.category]||'var(--cat-general)') + '">' + m.category + '</span><span style="font-size:11px;color:var(--ink-tertiary)">' + m.importance + '/10 · ' + (m.timestamp?.slice(0,10)||'') + '</span></div><div class="card-fact">' + m.fact + '</div><div class="card-meta">source: ' + source + ' · confidence: ' + (m.confidence || '—') + '</div>' + (m.tags?.length ? '<div class="card-tags">' + m.tags.map(t => '<span>#' + t + '</span>').join('') + '</div>' : '') + ((isWikiSource || isDocSource) ? '<div class="card-actions"><button class="btn btn-ghost btn-xs" style="background:var(--sky-glow);color:var(--sky)" onclick="event.stopPropagation();openWikiSource(\'' + source.replace(/'/g, "\\'") + '\')">View Source</button></div>' : '');
      card.addEventListener('click', () => showMemoryDetailModal(m.id));
      container.appendChild(card);
    });
  } catch (e) {
    document.getElementById('memories-list').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>';
  }
}

// ─── Memory Detail Modal ───
function showMemoryDetailModal(memoryId) {
  currentMemoryId = memoryId;
  const modal = document.getElementById('memory-detail-modal');
  const content = document.getElementById('memory-detail-content');
  content.innerHTML = '<div class="skeleton skeleton-block" style="margin-bottom:12px"></div><div class="skeleton skeleton-text w80" style="margin-bottom:8px"></div><div class="skeleton skeleton-text"></div>';
  modal.classList.add('open');
  fetch('/api/memories/' + memoryId)
    .then(r => r.json())
    .then(m => {
      if (m.error || !m.id) { content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Memory not found</div></div>'; return; }
      const colors = {preference:'var(--cat-preference)',fact:'var(--cat-fact)',event:'var(--cat-event)',procedure:'var(--cat-procedure)',concept:'var(--cat-concept)',meta:'var(--cat-meta)',general:'var(--cat-general)'};
      const color = colors[m.category] || 'var(--cat-general)';
      const source = m.source || '—';
      const isWikiSource = source.includes('wiki') || source.includes('Wiki');
      const isDocSource = source.includes('/') || source.includes('\\') || source.endsWith('.md') || source.endsWith('.txt');
      content.innerHTML = '<div class="detail-section"><span class="cat-badge" style="background:' + color + ';font-size:11px;padding:3px 10px">' + m.category + '</span><span style="margin-left:8px;font-size:12px;color:var(--ink-tertiary)">Importance: ' + m.importance + '/10</span></div><div class="detail-section"><div class="detail-value" style="font-size:14px;white-space:pre-wrap">' + escapeHtml(m.fact) + '</div></div><div class="detail-section"><div class="detail-meta"><span class="detail-meta-item">Created: ' + (m.timestamp ? new Date(m.timestamp).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric',hour:'2-digit',minute:'2-digit'}) : 'Unknown') + '</span><span class="detail-meta-item">Source: ' + escapeHtml(source) + '</span><span class="detail-meta-item">Confidence: ' + (m.confidence || '—') + '</span></div></div>' + (m.tags && m.tags.length ? '<div class="detail-section"><div class="detail-label">Tags</div><div class="detail-tags">' + m.tags.map(t => '<span>#' + escapeHtml(t) + '</span>').join('') + '</div></div>' : '') + (m.context ? '<div class="detail-section"><div class="detail-label">Context</div><div class="context-box">' + escapeHtml(m.context) + '</div></div>' : '') + '<div class="detail-section" style="padding-top:12px;border-top:1px solid var(--border-faint)"><div class="detail-label">Storage</div><div class="detail-storage">SQLite database → memory.db</div></div>';
      const sourceBtn = document.getElementById('memory-detail-source-btn');
      if (sourceBtn) { if (isWikiSource || isDocSource) { sourceBtn.style.display = 'inline-flex'; sourceBtn.onclick = () => openWikiSource(source); } else { sourceBtn.style.display = 'none'; } }
    })
    .catch(e => { content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>'; });
}
function closeMemoryDetailModal() { document.getElementById('memory-detail-modal').classList.remove('open'); currentMemoryId = null; }

function openWikiSource(source) {
  fetch('/api/wiki')
    .then(r => r.json())
    .then(data => {
      const pages = data.pages || [];
      let match = pages.find(p => p.title.toLowerCase() === source.toLowerCase());
      if (!match) match = pages.find(p => p.title.toLowerCase().includes(source.toLowerCase()) || source.toLowerCase().includes(p.title.toLowerCase()));
      if (!match) match = pages.find(p => (p.sources || []).some(s => s.includes(source) || source.includes(s)));
      if (match) {
        loadWikiPage(match.id);
        document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
        document.querySelector('nav button[data-tab="wiki"]').classList.add('active');
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-wiki').classList.add('active');
        currentTab = 'wiki';
        closeMemoryDetailModal();
      } else {
        showToast('No wiki page found for: ' + source, 'error');
      }
    })
    .catch(e => showToast('Error: ' + e.message, 'error'));
}

function editMemoryFromDetail() {
  closeMemoryDetailModal();
  if (currentMemoryId) {
    fetch('/api/memories/' + currentMemoryId)
      .then(r => r.json())
      .then(m => {
        if (m.id) {
          document.getElementById('modal-fact').value = m.fact;
          document.getElementById('modal-category').value = m.category;
          document.getElementById('modal-importance').value = m.importance;
          document.getElementById('modal-tags').value = (m.tags || []).join(', ');
          document.getElementById('new-memory-modal').dataset.editingId = m.id;
          showNewMemoryModal();
        }
      });
  }
}

async function deleteMemoryFromDetail() {
  if (!currentMemoryId) return;
  if (!confirm('Delete this memory?')) return;
  try {
    const res = await fetch('/api/memories/' + currentMemoryId, { method: 'DELETE' });
    if (res.ok) { showToast('Memory deleted'); closeMemoryDetailModal(); loadDashboard(); loadMemories(); refreshGraph(); }
    else showToast('Error deleting', 'error');
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

// ─── Wiki Detail Modal ───
function showWikiDetailModal(pageId) {
  const modal = document.getElementById('memory-detail-modal');
  const content = document.getElementById('memory-detail-content');
  content.innerHTML = '<div class="skeleton skeleton-block"></div><div class="skeleton skeleton-text w60"></div>';
  modal.classList.add('open');
  fetch('/api/wiki/' + pageId)
    .then(r => r.json())
    .then(page => {
      if (page.error || !page.id) { content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Wiki page not found</div></div>'; return; }
      const sources = page.sources || [];
      content.innerHTML = '<div class="detail-section"><span class="cat-badge" style="background:var(--accent);font-size:11px;padding:3px 10px">Wiki Page</span></div><h3 style="margin:12px 0;color:var(--accent);font-size:18px;font-weight:700">' + escapeHtml(page.title) + '</h3><div class="detail-section"><div class="detail-value" style="max-height:300px;overflow-y:auto;white-space:pre-wrap">' + escapeHtml(page.content || 'No content') + '</div></div>' + (sources.length ? '<div class="detail-section"><div class="detail-label">Sources (' + sources.length + ')</div><div style="max-height:150px;overflow-y:auto;margin-top:4px">' + sources.map(s => '<div style="font-size:11px;color:var(--ink-tertiary);font-family:var(--font-mono);background:var(--surface-2);padding:4px 8px;margin:2px 0;border-radius:var(--radius-xs)">' + escapeHtml(s) + '</div>').join('') + '</div></div>' : '') + (page.related && page.related.length ? '<div class="detail-section"><div class="detail-label">Related</div><div class="detail-tags">' + page.related.map(r => '<span>' + escapeHtml(r) + '</span>').join('') + '</div></div>' : '') + '<div class="detail-section" style="padding-top:12px;border-top:1px solid var(--border-faint)"><div class="detail-label">Storage</div><div class="detail-storage">Wiki markdown → wiki/' + page.id + '.md</div></div>';
      const sourceBtn = document.getElementById('memory-detail-source-btn');
      if (sourceBtn) sourceBtn.style.display = 'none';
    })
    .catch(e => { content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>'; });
}

// ─── Document Detail Modal ───
function showDocumentDetailModal(docTitle, nodeData) {
  const modal = document.getElementById('memory-detail-modal');
  const content = document.getElementById('memory-detail-content');
  content.innerHTML = '<div class="skeleton skeleton-block"></div><div class="skeleton skeleton-text w80"></div>';
  modal.classList.add('open');
  const sourcePath = (nodeData && nodeData.source) ? nodeData.source : docTitle;
  fetch('/api/memories?limit=200')
    .then(r => r.json())
    .then(data => {
      const memories = (data.memories || []).filter(m => m.source && (m.source === sourcePath || m.source.includes(sourcePath) || sourcePath.includes(m.source)));
      const catColors = {preference:'var(--cat-preference)',fact:'var(--cat-fact)',event:'var(--cat-event)',procedure:'var(--cat-procedure)',concept:'var(--cat-concept)',meta:'var(--cat-meta)',general:'var(--cat-general)'};
      content.innerHTML = '<div class="detail-section"><span class="cat-badge" style="background:var(--sky);font-size:11px;padding:3px 10px">Document</span></div><h3 style="margin:12px 0;color:var(--sky);font-size:18px;font-weight:700">' + escapeHtml(docTitle) + '</h3><div class="detail-section"><div class="detail-value" style="color:var(--ink-secondary)">Indexed into RAG vector store.' + (memories.length ? ' Found ' + memories.length + ' extracted memories.' : ' No specific memories extracted.') + '</div></div>' + (sourcePath ? '<div class="detail-section"><div class="detail-label">Source Path</div><div class="detail-storage">' + escapeHtml(sourcePath) + '</div></div>' : '') + (memories.length ? '<div class="detail-section"><div class="detail-label">Extracted Memories (' + memories.length + ')</div><div style="max-height:250px;overflow-y:auto;margin-top:4px">' + memories.map(m => '<div style="background:var(--surface-2);border:1px solid var(--border-faint);border-radius:var(--radius-xs);padding:8px;margin:4px 0;font-size:11px"><div style="display:flex;gap:8px;margin-bottom:4px"><span class="cat-badge" style="background:' + (catColors[m.category]||'var(--cat-general)') + '">' + m.category + '</span><span style="color:var(--ink-tertiary)">' + m.importance + '/10</span></div><div style="white-space:pre-wrap;color:var(--ink-primary)">' + escapeHtml(m.fact.slice(0,200)) + (m.fact.length > 200 ? '...' : '') + '</div></div>').join('') + '</div></div>' : '') + '<div class="detail-section" style="padding-top:12px;border-top:1px solid var(--border-faint)"><div class="detail-label">Storage</div><div class="detail-storage">ChromaDB vectors → data/chroma/</div></div>';
      const sourceBtn = document.getElementById('memory-detail-source-btn');
      if (sourceBtn) sourceBtn.style.display = 'none';
    })
    .catch(e => { content.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>'; });
}

// ─── New Memory Modal ───
function showNewMemoryModal() { document.getElementById('new-memory-modal').classList.add('open'); }
function closeNewMemoryModal() { document.getElementById('new-memory-modal').classList.remove('open'); delete document.getElementById('new-memory-modal').dataset.editingId; }
async function saveNewMemory() {
  const fact = document.getElementById('modal-fact').value.trim();
  if (!fact) { showToast('Please enter a fact', 'error'); return; }
  const tags = document.getElementById('modal-tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const editingId = document.getElementById('new-memory-modal').dataset.editingId;
  const isEditing = !!editingId;
  try {
    if (isEditing) {
      await fetch('/api/memories/' + editingId, { method: 'DELETE' });
    }
    await fetch('/api/memories', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ fact, category: document.getElementById('modal-category').value, importance: parseInt(document.getElementById('modal-importance').value) || 5, tags, source: 'web-ui' })
    });
    showToast(isEditing ? 'Memory updated!' : 'Memory saved!');
    closeNewMemoryModal();
    document.getElementById('modal-fact').value = '';
    document.getElementById('modal-tags').value = '';
    loadMemories();
    loadDashboard();
    refreshGraph();
  } catch (e) { showToast('Error: ' + e.message, 'error'); }
}

// ─── RAG Search ───
async function doSearch() {
  const query = document.getElementById('rag-query').value.trim();
  if (!query) return;
  try {
    const res = await fetch('/api/search?query=' + encodeURIComponent(query) + '&limit=10');
    const data = await res.json();
    const container = document.getElementById('search-results');
    container.innerHTML = '';
    if (!data.results || data.results.length === 0) {
      container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><div class="text">No results found</div><div class="hint">Try a different search query</div></div>';
      return;
    }
    data.results.forEach(r => {
      const div = document.createElement('div');
      div.className = 'search-result';
      div.innerHTML = '<div class="result-source">' + r.source + '</div><div class="result-content">' + r.content + '</div><div class="result-score">relevance: ' + (r.score * 100).toFixed(0) + '%</div>';
      container.appendChild(div);
    });
  } catch (e) {
    document.getElementById('search-results').innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>';
  }
}

// ─── Wiki ───
let wikiPages = [];
async function loadWiki() {
  const search = document.getElementById('wiki-search').value;
  try {
    const url = '/api/wiki' + (search ? '?search=' + encodeURIComponent(search) : '');
    const res = await fetch(url);
    const data = await res.json();
    wikiPages = data.pages || [];
    const list = document.getElementById('wiki-page-list');
    list.innerHTML = '';
    if (!wikiPages.length) { list.innerHTML = '<li style="color:var(--ink-tertiary);font-size:11px;border:none;cursor:default">No wiki pages</li>'; return; }
    wikiPages.forEach(p => {
      const li = document.createElement('li');
      li.innerHTML = escapeHtml(p.title) + (p.summary ? '<div class="page-summary">' + escapeHtml(p.summary.slice(0,80)) + '</div>' : '');
      li.dataset.id = p.id;
      li.addEventListener('click', () => loadWikiPage(p.id));
      list.appendChild(li);
    });
  } catch (e) {
    document.getElementById('wiki-page-list').innerHTML = '<li style="color:var(--red);font-size:11px;border:none;cursor:default">Error: ' + e.message + '</li>';
  }
}
async function loadWikiPage(pageId) {
  document.querySelectorAll('.wiki-page-list li').forEach(li => li.classList.remove('active'));
  const li = document.querySelector('.wiki-page-list li[data-id="' + pageId + '"]');
  if (li) li.classList.add('active');
  try {
    const res = await fetch('/api/wiki/' + pageId);
    const page = await res.json();
    const container = document.getElementById('wiki-content');
    let html = page.content
      .replace(/^### (.+)$/gm, '<h3>$1</h3>')
      .replace(/^## (.+)$/gm, '<h2>$1</h2>')
      .replace(/^# (.+)$/gm, '<h1>$1</h1>')
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[\[(.+?)\]\]/g, '<a href="#" onclick="loadWikiByTitle(\'$1\');return false;">$1</a>')
      .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
      .replace(/^- (.+)$/gm, '<li>$1</li>')
      .replace(/\n\n/g, '</p><p>')
      .replace(/\n/g, '<br>');
    container.innerHTML = '<p>' + html + '</p>';
  } catch (e) {
    document.getElementById('wiki-content').innerHTML = '<div class="wiki-empty"><div class="icon">⚠️</div><div class="text">Error: ' + e.message + '</div></div>';
  }
}
async function loadWikiByTitle(title) {
  const page = wikiPages.find(p => p.title.toLowerCase() === title.toLowerCase());
  if (page) loadWikiPage(page.id);
}

// ─── Init ───
loadDashboard();
</script>
