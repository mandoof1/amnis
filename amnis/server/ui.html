<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Amnis</title>
<!--
  Fully self-contained: no CDN scripts, no webfonts, no external requests.
  The 0.1 dashboard pulled vis-network and Inter from third-party CDNs, which
  made a local-first memory tool fail offline and leak every page view.
  The knowledge graph below is a ~200-line canvas force simulation instead.
-->
<style>
:root {
  color-scheme: light;
  --bg:            #f6f7f9;
  --surface:       #ffffff;
  --surface-2:     #f1f3f6;
  --surface-3:     #e7eaef;
  --border:        #dde1e8;
  --border-faint:  #e9ecf1;
  --ink:           #12161c;
  --ink-2:         #4a525e;
  --ink-3:         #7b8595;
  --accent:        #6d4aff;
  --accent-soft:   #efeaff;
  --accent-ink:    #ffffff;
  --emerald:       #0f9d63;
  --sky:           #0284c7;
  --amber:         #c2740a;
  --rose:          #dc2626;
  --shadow-sm:     0 1px 2px rgba(16,20,28,.06), 0 1px 3px rgba(16,20,28,.04);
  --shadow-md:     0 4px 12px rgba(16,20,28,.08), 0 1px 3px rgba(16,20,28,.05);
  --shadow-lg:     0 18px 48px rgba(16,20,28,.16);
  --radius:        12px;
  --radius-sm:     8px;
  --radius-xs:     6px;
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --cat-preference: #b45309;
  --cat-fact:       #0f9d63;
  --cat-event:      #2563eb;
  --cat-procedure:  #7c3aed;
  --cat-concept:    #db2777;
  --cat-theme:      #e11d48;
  --cat-meta:       #64748b;
  --cat-general:    #64748b;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:           #0b0d11;
    --surface:      #14181f;
    --surface-2:    #1b2029;
    --surface-3:    #242b36;
    --border:       #2a313d;
    --border-faint: #1f242e;
    --ink:          #e9edf3;
    --ink-2:        #a4aebd;
    --ink-3:        #6b7686;
    --accent:       #9d86ff;
    --accent-soft:  #241d45;
    --accent-ink:   #0b0d11;
    --emerald:      #35d399;
    --sky:          #38bdf8;
    --amber:        #fbbf24;
    --rose:         #fb7185;
    --shadow-sm:    0 1px 2px rgba(0,0,0,.4);
    --shadow-md:    0 4px 14px rgba(0,0,0,.45);
    --shadow-lg:    0 20px 56px rgba(0,0,0,.6);
    --cat-preference: #fbbf24;
    --cat-fact:       #35d399;
    --cat-event:      #60a5fa;
    --cat-procedure:  #a78bfa;
    --cat-concept:    #f472b6;
    --cat-theme:      #fb7185;
    --cat-meta:       #94a3b8;
    --cat-general:    #94a3b8;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:           #0b0d11;
  --surface:      #14181f;
  --surface-2:    #1b2029;
  --surface-3:    #242b36;
  --border:       #2a313d;
  --border-faint: #1f242e;
  --ink:          #e9edf3;
  --ink-2:        #a4aebd;
  --ink-3:        #6b7686;
  --accent:       #9d86ff;
  --accent-soft:  #241d45;
  --accent-ink:   #0b0d11;
  --emerald:      #35d399;
  --sky:          #38bdf8;
  --amber:        #fbbf24;
  --rose:         #fb7185;
  --shadow-sm:    0 1px 2px rgba(0,0,0,.4);
  --shadow-md:    0 4px 14px rgba(0,0,0,.45);
  --shadow-lg:    0 20px 56px rgba(0,0,0,.6);
  --cat-preference: #fbbf24;
  --cat-fact:       #35d399;
  --cat-event:      #60a5fa;
  --cat-procedure:  #a78bfa;
  --cat-concept:    #f472b6;
  --cat-theme:      #fb7185;
  --cat-meta:       #94a3b8;
  --cat-general:    #94a3b8;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

/* ── Shell ─────────────────────────────────────────────────────── */
#app { display: grid; grid-template-columns: 232px 1fr; min-height: 100vh; }

#sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  padding: 18px 12px;
  gap: 4px;
  position: sticky; top: 0; height: 100vh;
}
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 18px; }
.brand-mark {
  width: 28px; height: 28px; border-radius: 8px; flex: none;
  background: linear-gradient(140deg, var(--accent), var(--sky));
  display: grid; place-items: center;
  color: #fff; font-weight: 800; font-size: 15px;
}
.brand-name { font-weight: 700; font-size: 16px; letter-spacing: -.01em; }
.brand-ver { font-size: 11px; color: var(--ink-3); font-family: var(--mono); }

.nav-btn {
  display: flex; align-items: center; gap: 10px;
  width: 100%; padding: 9px 11px;
  background: none; border: 0; border-radius: var(--radius-sm);
  color: var(--ink-2); font-weight: 500; text-align: left;
  cursor: pointer; transition: background .12s, color .12s;
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-btn .ico { width: 18px; text-align: center; font-size: 15px; flex: none; }
.nav-btn .count {
  margin-left: auto; font-size: 11px; font-family: var(--mono);
  color: var(--ink-3); background: var(--surface-2);
  padding: 1px 6px; border-radius: 20px;
}
.nav-sep { height: 1px; background: var(--border-faint); margin: 10px 6px; }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: 6px; }
.status-pill {
  display: flex; align-items: center; gap: 7px;
  font-size: 11.5px; color: var(--ink-3);
  padding: 7px 11px; border-radius: var(--radius-sm); background: var(--surface-2);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--emerald); flex: none; }
.status-dot.warn { background: var(--amber); }
.status-dot.err  { background: var(--rose); }

#main { display: flex; flex-direction: column; min-width: 0; }
#topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface) 80%, transparent);
  backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 20;
}
#view-title { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
#view-sub { font-size: 12.5px; color: var(--ink-3); }
.topbar-spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  border: 1px solid var(--border); border-bottom-width: 2px;
  border-radius: 5px; padding: 1px 5px; background: var(--surface-2);
}
#content { padding: 24px; flex: 1; min-width: 0; }
.view { display: none; }
.view.active { display: block; animation: fade .18s ease; }
@keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

/* ── Controls ──────────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 8px 14px; border-radius: var(--radius-sm);
  border: 1px solid var(--border); background: var(--surface);
  color: var(--ink); font-weight: 550; cursor: pointer;
  transition: background .12s, border-color .12s, transform .06s;
  white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn-primary:hover { filter: brightness(1.08); background: var(--accent); border-color: var(--accent); }
.btn-danger { color: var(--rose); border-color: color-mix(in srgb, var(--rose) 40%, var(--border)); }
.btn-danger:hover { background: color-mix(in srgb, var(--rose) 12%, transparent); }
.btn-sm { padding: 5px 10px; font-size: 12.5px; }
.btn-icon { padding: 7px 9px; }

.input, .select, .textarea {
  width: 100%; padding: 9px 12px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  outline: none; transition: border-color .12s, box-shadow .12s;
}
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent);
}
.textarea { resize: vertical; min-height: 92px; font-family: inherit; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; font-weight: 600; color: var(--ink-2); }
.field .hint { font-size: 11.5px; color: var(--ink-3); }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.toolbar .grow { flex: 1; min-width: 220px; }

.segmented { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-sm); padding: 3px; gap: 2px; }
.segmented button {
  border: 0; background: none; padding: 5px 12px; border-radius: 6px;
  font-size: 12.5px; font-weight: 550; color: var(--ink-3); cursor: pointer;
}
.segmented button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-sm); }

/* ── Cards & panels ────────────────────────────────────────────── */
.panel {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); box-shadow: var(--shadow-sm);
}
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 14px 18px; border-bottom: 1px solid var(--border-faint);
}
.panel-head h2 { margin: 0; font-size: 14px; font-weight: 650; }
.panel-body { padding: 16px 18px; }
.panel-badge {
  font-size: 11px; font-family: var(--mono); color: var(--ink-3);
  background: var(--surface-2); padding: 2px 8px; border-radius: 20px;
}

.stats-grid {
  display: grid; gap: 14px; margin-bottom: 20px;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
}
.stat {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm);
}
.stat .label {
  font-size: 11px; font-weight: 650; letter-spacing: .06em;
  text-transform: uppercase; color: var(--ink-3);
  display: flex; align-items: center; gap: 6px;
}
.stat .value { font-size: 30px; font-weight: 720; letter-spacing: -.02em; margin: 6px 0 2px; }
.stat .sub { font-size: 12px; color: var(--ink-3); }

.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); }

/* ── Lists ─────────────────────────────────────────────────────── */
.mem-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
  cursor: pointer; transition: border-color .12s, box-shadow .12s, transform .08s;
}
.mem-card:hover { border-color: var(--accent); box-shadow: var(--shadow-md); transform: translateY(-1px); }
.mem-card .text { margin-bottom: 9px; white-space: pre-wrap; overflow-wrap: anywhere; }
.mem-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); }
.badge {
  font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 20px; color: #fff; white-space: nowrap;
}
.imp-bar { display: inline-flex; gap: 2px; align-items: center; }
.imp-bar i { width: 3px; height: 11px; border-radius: 2px; background: var(--surface-3); display: block; }
.imp-bar i.on { background: var(--accent); }
.tag {
  font-size: 11px; font-family: var(--mono); color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--border-faint);
  padding: 1px 7px; border-radius: 20px;
}

.compact-list { list-style: none; margin: 0; padding: 0; }
.compact-list li {
  padding: 10px 0; border-bottom: 1px solid var(--border-faint);
  display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
}
.compact-list li:last-child { border-bottom: 0; }
.compact-list li:hover .li-text { color: var(--accent); }
.li-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.li-side { font-size: 11px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; }

.bar-row { display: grid; grid-template-columns: 96px 1fr 44px; gap: 10px; align-items: center; margin-bottom: 9px; }
.bar-row .name { font-size: 12px; color: var(--ink-2); text-transform: capitalize; }
.bar-track { height: 8px; background: var(--surface-2); border-radius: 20px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 20px; transition: width .5s cubic-bezier(.4,0,.2,1); }
.bar-row .num { font-size: 12px; font-family: var(--mono); color: var(--ink-3); text-align: right; }

.result {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px;
}
.result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.result-src { font-family: var(--mono); font-size: 11.5px; color: var(--sky); overflow-wrap: anywhere; }
.result-body { color: var(--ink-2); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; }
.score { font-family: var(--mono); font-size: 11px; color: var(--ink-3); margin-left: auto; }

/* ── Wiki ──────────────────────────────────────────────────────── */
.wiki-layout { display: grid; grid-template-columns: 260px 1fr; gap: 16px; align-items: start; }
.wiki-list { list-style: none; margin: 0; padding: 6px; max-height: 68vh; overflow-y: auto; }
.wiki-list li {
  padding: 8px 10px; border-radius: var(--radius-xs); cursor: pointer;
  font-size: 13px; color: var(--ink-2);
}
.wiki-list li:hover { background: var(--surface-2); color: var(--ink); }
.wiki-list li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.wiki-doc { padding: 22px 26px; max-height: 68vh; overflow-y: auto; }
.wiki-doc h1 { font-size: 23px; margin: 0 0 6px; letter-spacing: -.02em; }
.wiki-doc h2 { font-size: 16px; margin: 24px 0 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border-faint); }
.wiki-doc h3 { font-size: 14px; margin: 18px 0 6px; color: var(--ink-2); }
.wiki-doc p { margin: 0 0 10px; }
.wiki-doc ul { margin: 0 0 12px; padding-left: 20px; }
.wiki-doc li { margin-bottom: 5px; }
.wiki-doc blockquote {
  margin: 0 0 12px; padding: 8px 14px; border-left: 3px solid var(--accent);
  background: var(--surface-2); border-radius: 0 var(--radius-xs) var(--radius-xs) 0;
  color: var(--ink-2); font-size: 13px;
}
.wiki-doc code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.wiki-link { color: var(--accent); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }

/* ── Graph ─────────────────────────────────────────────────────── */
#graph-wrap {
  position: relative; height: calc(100vh - 190px); min-height: 420px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); overflow: hidden;
}
#graph-canvas { display: block; width: 100%; height: 100%; cursor: grab; }
#graph-canvas.dragging { cursor: grabbing; }
.graph-overlay { position: absolute; display: flex; gap: 6px; z-index: 3; }
.graph-overlay.tl { top: 12px; left: 12px; flex-direction: column; align-items: flex-start; }
.graph-overlay.tr { top: 12px; right: 12px; }
.graph-legend {
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 10px 12px; font-size: 12px; display: flex; flex-direction: column; gap: 6px;
  backdrop-filter: blur(6px);
}
.legend-item { display: flex; align-items: center; gap: 8px; color: var(--ink-2); }
.legend-swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.legend-swatch.box { border-radius: 3px; }
#graph-tip {
  position: absolute; z-index: 5; pointer-events: none; max-width: 320px;
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 8px 11px; font-size: 12.5px; display: none; overflow-wrap: anywhere;
}
#graph-tip .tip-kind { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); margin-bottom: 3px; }
#graph-hud {
  position: absolute; bottom: 12px; left: 12px; z-index: 3;
  font-family: var(--mono); font-size: 11px; color: var(--ink-3);
  background: color-mix(in srgb, var(--surface) 85%, transparent);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 5px 9px;
}

/* ── Modal ─────────────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(9,11,15,.55); backdrop-filter: blur(3px);
  display: none; align-items: center; justify-content: center; padding: 20px;
}
.modal-backdrop.open { display: flex; animation: fade .14s ease; }
.modal {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 16px; box-shadow: var(--shadow-lg);
  width: 100%; max-width: 560px; max-height: 88vh; overflow-y: auto;
}
.modal-head { display: flex; align-items: center; gap: 10px; padding: 18px 22px 0; }
.modal-head h2 { margin: 0; font-size: 16px; font-weight: 650; flex: 1; }
.modal-body { padding: 16px 22px; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 0 22px 20px; flex-wrap: wrap; }
.close-x { border: 0; background: none; color: var(--ink-3); font-size: 20px; cursor: pointer; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.close-x:hover { background: var(--surface-2); color: var(--ink); }
.detail-row { padding: 10px 0; border-bottom: 1px solid var(--border-faint); }
.detail-row:last-child { border-bottom: 0; }
.detail-label { font-size: 11px; font-weight: 650; letter-spacing: .05em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 3px; }
.detail-value { font-size: 13px; overflow-wrap: anywhere; white-space: pre-wrap; }
.detail-value.mono { font-family: var(--mono); font-size: 12px; color: var(--ink-2); }

/* ── Command palette ───────────────────────────────────────────── */
#palette-backdrop { align-items: flex-start; padding-top: 12vh; }
#palette { max-width: 560px; width: 100%; }
#palette-input { border: 0; border-bottom: 1px solid var(--border); border-radius: 0; padding: 16px 20px; font-size: 15px; }
#palette-input:focus { box-shadow: none; border-color: var(--accent); }
#palette-results { list-style: none; margin: 0; padding: 6px; max-height: 46vh; overflow-y: auto; }
#palette-results li { padding: 9px 14px; border-radius: var(--radius-xs); cursor: pointer; display: flex; align-items: center; gap: 10px; }
#palette-results li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
#palette-results .pal-hint { margin-left: auto; font-size: 11px; color: var(--ink-3); }

/* ── Toasts, skeletons, empty ──────────────────────────────────── */
#toasts { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.toast {
  background: var(--surface); border: 1px solid var(--border);
  border-left: 3px solid var(--accent);
  border-radius: var(--radius-sm); box-shadow: var(--shadow-lg);
  padding: 11px 15px; font-size: 13px; max-width: 380px;
  animation: slidein .2s cubic-bezier(.2,.8,.2,1); overflow-wrap: anywhere;
}
.toast.ok  { border-left-color: var(--emerald); }
.toast.err { border-left-color: var(--rose); }
@keyframes slidein { from { opacity: 0; transform: translateX(24px); } to { opacity: 1; transform: none; } }

.skeleton { background: linear-gradient(90deg, var(--surface-2) 25%, var(--surface-3) 50%, var(--surface-2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: 6px; }
@keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
.sk-value { height: 30px; width: 62%; margin: 6px 0 4px; }
.sk-line { height: 11px; width: 80%; margin: 4px 0; }
.sk-card { height: 68px; margin-bottom: 10px; }

.empty { text-align: center; padding: 48px 20px; color: var(--ink-3); }
.empty .em-ico { font-size: 30px; opacity: .5; margin-bottom: 8px; }
.empty .em-title { font-weight: 600; color: var(--ink-2); margin-bottom: 4px; }
.spinner {
  width: 13px; height: 13px; border: 2px solid var(--border);
  border-top-color: var(--accent); border-radius: 50%;
  animation: spin .7s linear infinite; display: inline-block;
}
@keyframes spin { to { transform: rotate(360deg); } }

.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

@media (max-width: 900px) {
  #app { grid-template-columns: 1fr; }

}
@media (prefers-reduced-motion: reduce) {

}
</style>

<div id="toasts" aria-live="polite" aria-atomic="false"></div>
<script>
'use strict';
/* ═══════════════════════════════════════════════════════════════════
   Amnis dashboard.

   Every piece of server data reaches the DOM through el()/text nodes.
   There is no innerHTML interpolation anywhere in this file — the 0.1 UI
   built markup by concatenating memory text, wiki content, source paths and
   error messages into innerHTML, so any of those could execute script.
   ═══════════════════════════════════════════════════════════════════ */

const CATEGORIES = ['preference','fact','event','procedure','concept','theme','meta','general'];
const CAT_COLOR = c => getComputedStyle(document.documentElement)
  .getPropertyValue('--cat-' + (CATEGORIES.includes(c) ? c : 'general')).trim() || '#94a3b8';

/* ── DOM helpers ───────────────────────────────────────────────── */

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const child of children.flat(4)) {
    if (child === null || child === undefined || child === false || child === '') continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const $ = sel => document.querySelector(sel);
const $$ = sel => Array.from(document.querySelectorAll(sel));
function clear(node) { while (node.firstChild) node.removeChild(node.firstChild); }
function fill(node, ...children) { clear(node); node.append(...children.flat(4).filter(c => c !== null && c !== undefined && c !== false)); return node; }

function toast(message, kind) {
  const node = el('div', { class: 'toast ' + (kind || '') }, String(message));
  $('#toasts').append(node);
  setTimeout(() => { node.style.opacity = '0'; setTimeout(() => node.remove(), 220); }, kind === 'err' ? 6000 : 3200);
}

function skeletons(count, cls) {
  return Array.from({ length: count }, () => el('div', { class: 'skeleton ' + (cls || 'sk-card') }));
}

function emptyState(icon, title, detail) {
  return el('div', { class: 'empty' },
    el('div', { class: 'em-ico' }, icon),
    el('div', { class: 'em-title' }, title),
    detail ? el('div', {}, detail) : null);
}

function relTime(iso) {
  if (!iso) return '—';
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return '—';
  const secs = Math.max(0, (Date.now() - then) / 1000);
  if (secs < 60) return 'just now';
  const units = [[60, 'm'], [3600, 'h'], [86400, 'd'], [2592000, 'mo'], [31536000, 'y']];
  let last = 'm', div = 60;
  for (const [s, label] of units) { if (secs >= s) { div = s; last = label; } }
  return Math.floor(secs / div) + last + ' ago';
}

/* ── API ───────────────────────────────────────────────────────── */

const TOKEN_KEY = 'amnis.token';
function authHeaders() {
  const token = localStorage.getItem(TOKEN_KEY);
  return token ? { 'X-Amnis-Token': token } : {};
}

async function api(path, options) {
  const opts = Object.assign({ headers: {} }, options || {});
  opts.headers = Object.assign({}, authHeaders(), opts.headers);
  if (opts.body !== undefined && typeof opts.body !== 'string') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, opts);
  let payload = null;
  try { payload = await res.json(); } catch (_) { /* empty body is fine */ }
  if (!res.ok) {
    let detail = (payload && payload.detail) || res.statusText || ('HTTP ' + res.status);
    if (Array.isArray(detail)) {
      detail = detail.map(d => (d.loc ? d.loc.slice(-1)[0] + ': ' : '') + d.msg).join('; ');
    }
    if (res.status === 401) detail = 'Unauthorised — set an API token via the command palette.';
    const err = new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    err.status = res.status;
    throw err;
  }
  return payload;
}

/* ── Shared renderers ──────────────────────────────────────────── */

function importanceBar(n) {
  const bar = el('span', { class: 'imp-bar', title: 'Importance ' + n + '/10' });
  for (let i = 1; i <= 10; i++) bar.append(el('i', { class: i <= n ? 'on' : '' }));
  return bar;
}

function categoryBadge(cat) {
  return el('span', { class: 'badge', style: { background: CAT_COLOR(cat) } }, cat || 'general');
}

function memoryCard(memory) {
  return el('div', {
    class: 'mem-card', tabindex: '0', role: 'button',
    onclick: () => showMemoryDetail(memory.id),
    onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showMemoryDetail(memory.id); } },
  },
    el('div', { class: 'text' }, memory.fact),
    el('div', { class: 'mem-meta' },
      categoryBadge(memory.category),
      importanceBar(memory.importance),
      el('span', {}, relTime(memory.timestamp)),
      memory.access_count ? el('span', {}, '· ' + memory.access_count + ' recalls') : null,
      (memory.tags || []).slice(0, 5).map(t => el('span', { class: 'tag' }, t))));
}

/* ── Dashboard ─────────────────────────────────────────────────── */

let cachedStatus = null;

function statCard(label, value, sub) {
  return el('div', { class: 'stat' },
    el('div', { class: 'label' }, label),
    el('div', { class: 'value' }, value),
    el('div', { class: 'sub' }, sub));
}

async function loadDashboard() {
  fill($('#stats-grid'), skeletons(4, 'sk-card'));
  fill($('#recent-list'), skeletons(4, 'sk-line'));

  let status;
  try {
    status = cachedStatus = await api('/api/status');
  } catch (err) {
    fill($('#stats-grid'), emptyState('⚠', 'Could not reach the Amnis API', err.message));
    setStatus('err', 'offline');
    return;
  }

  const mem = status.memory || {}, rag = status.rag || {}, wiki = status.wiki || {}, ep = status.episodic || {};
  const degraded = status.status === 'degraded';
  setStatus(degraded ? 'warn' : '', degraded ? 'degraded' : 'operational');
  if (degraded) {
    for (const [layer, message] of Object.entries(status.errors || {})) toast(layer + ': ' + message, 'err');
  }

  fill($('#stats-grid'),
    statCard('Memories', mem.total_memories ?? 0,
      'avg importance ' + (mem.avg_importance ?? '—') + ' · ' + (mem.keyword_indexed ?? 0) + ' indexed'),
    statCard('Indexed chunks', rag.total_chunks ?? 0,
      (rag.unique_sources ?? 0) + ' sources · ' + (rag.embedding_model || '—')),
    statCard('Wiki pages', wiki.total_pages ?? 0,
      (wiki.total_sources ?? 0) + ' distinct sources'),
    statCard('Episodes', ep.total_episodes ?? 0,
      (ep.unique_sessions ?? 0) + ' sessions'));

  $('#nav-count-memories').textContent = mem.total_memories ?? '';
  $('#nav-count-wiki').textContent = wiki.total_pages ?? '';
  $('#nav-count-episodes').textContent = ep.total_episodes ?? '';

  renderCategoryChart(mem.by_category || {});

  try {
    const data = await api('/api/memories?limit=8');
    const list = data.memories || [];
    $('#recent-badge').textContent = list.length ? list.length + ' shown' : '';
    fill($('#recent-list'), list.length
      ? list.map(m => el('li', { onclick: () => showMemoryDetail(m.id) },
          el('span', { class: 'li-text' }, m.fact),
          el('span', { class: 'li-side' }, relTime(m.timestamp))))
      : emptyState('✦', 'No memories yet', 'Store one with the New memory button.'));
  } catch (err) {
    fill($('#recent-list'), emptyState('⚠', 'Could not load memories', err.message));
  }
}

function renderCategoryChart(byCategory) {
  const entries = Object.entries(byCategory).sort((a, b) => b[1] - a[1]);
  if (!entries.length) { fill($('#category-chart'), emptyState('◔', 'Nothing to chart yet')); return; }
  const max = Math.max(...entries.map(e => e[1]));
  fill($('#category-chart'), entries.map(([cat, count]) => el('div', { class: 'bar-row' },
    el('span', { class: 'name' }, cat),
    el('div', { class: 'bar-track' },
      el('div', { class: 'bar-fill', style: { width: (count / max * 100) + '%', background: CAT_COLOR(cat) } })),
    el('span', { class: 'num' }, count))));
}

function setStatus(kind, text) {
  $('#status-dot').className = 'status-dot ' + (kind || '');
  $('#status-text').textContent = text;
}

/* ── Memories ──────────────────────────────────────────────────── */

async function loadMemories() {
  const target = $('#memories-list');
  fill(target, skeletons(5));
  const params = new URLSearchParams({ limit: '100' });
  const query = $('#mem-search').value.trim();
  const category = $('#mem-category').value;
  const importance = $('#mem-importance').value;
  if (query) params.set('query', query);
  if (category) params.set('category', category);
  if (importance !== '0') params.set('min_importance', importance);

  try {
    const data = await api('/api/memories?' + params);
    const list = data.memories || [];
    fill(target, list.length
      ? [el('div', { class: 'mem-meta', style: { marginBottom: '12px' } },
          el('span', {}, list.length + ' of ' + (data.grand_total ?? list.length) + ' memories')),
         ...list.map(memoryCard)]
      : emptyState('⌕', 'No matches', query ? 'Try fewer or different words.' : 'Store your first memory.'));
  } catch (err) {
    fill(target, emptyState('⚠', 'Search failed', err.message));
  }
}

/* ── Document search ───────────────────────────────────────────── */

let searchMode = 'hybrid';

async function doSearch() {
  const query = $('#rag-query').value.trim();
  const target = $('#search-results');
  if (!query) { fill(target, emptyState('⌕', 'Type something to search')); return; }
  fill(target, skeletons(4));

  try {
    const data = await api('/api/search?query=' + encodeURIComponent(query) +
      '&limit=15&mode=' + encodeURIComponent(searchMode));
    const results = data.results || [];
    if (!results.length) { fill(target, emptyState('⌕', 'No results', 'Nothing indexed matches that.')); return; }

    fill(target, results.map(r => {
      const scoreText = r.hybrid_score !== undefined ? 'rrf ' + r.hybrid_score.toFixed(4)
        : r.score !== undefined ? 'score ' + Number(r.score).toFixed(3)
        : r.rank !== undefined ? 'bm25 ' + Number(r.rank).toFixed(2) : '';
      return el('div', { class: 'result' },
        el('div', { class: 'result-head' },
          el('span', { class: 'badge', style: { background: 'var(--ink-3)' } }, r.search_type || 'result'),
          el('span', { class: 'result-src' }, r.source || 'unknown'),
          r.heading ? el('span', { class: 'tag' }, r.heading) : null,
          scoreText ? el('span', { class: 'score' }, scoreText) : null),
        el('div', { class: 'result-body' }, r.content || ''));
    }));
  } catch (err) {
    fill(target, emptyState('⚠', 'Search failed', err.message));
  }
}

/* ── Wiki ──────────────────────────────────────────────────────── */

let wikiPages = [];

async function loadWiki() {
  const listNode = $('#wiki-list');
  fill(listNode, skeletons(6, 'sk-line'));
  const search = $('#wiki-search').value.trim();
  try {
    const data = await api('/api/wiki' + (search ? '?search=' + encodeURIComponent(search) : ''));
    wikiPages = data.pages || [];
    if (!wikiPages.length) {
      fill(listNode, emptyState('▤', 'No pages'));
      fill($('#wiki-doc'), emptyState('▤', 'Nothing compiled yet', 'Press Compile to build pages from your notes and memories.'));
      return;
    }
    fill(listNode, wikiPages.map(p => el('li', {
      dataset: { id: p.id }, role: 'option', 'aria-selected': 'false',
      onclick: () => openWikiPage(p.id),
    }, p.title)));
    openWikiPage(wikiPages[0].id);
  } catch (err) {
    fill(listNode, emptyState('⚠', 'Could not load wiki', err.message));
  }
}

async function openWikiPage(pageId) {
  $$('#wiki-list li').forEach(li => li.setAttribute('aria-selected', String(li.dataset.id === pageId)));
  const doc = $('#wiki-doc');
  fill(doc, skeletons(5, 'sk-line'));
  try {
    const page = await api('/api/wiki/' + encodeURIComponent(pageId));
    fill(doc,
      el('div', { class: 'mem-meta', style: { marginBottom: '14px' } },
        el('span', { class: 'tag' }, 'v' + page.version),
        el('span', {}, 'compiled ' + relTime(page.last_compiled)),
        el('span', {}, '· ' + (page.sources || []).length + ' sources')),
      renderMarkdown(page.content || ''));
    doc.scrollTop = 0;
  } catch (err) {
    fill(doc, emptyState('⚠', 'Could not load page', err.message));
  }
}

function openWikiByTitle(title) {
  const match = wikiPages.find(p => p.title.toLowerCase() === String(title).toLowerCase());
  if (match) { switchView('wiki'); openWikiPage(match.id); }
  else toast('No wiki page titled "' + title + '"');
}

/* Markdown → DOM. Builds real nodes, so wiki content (which is derived from
   indexed files and therefore untrusted) can never become markup. */
function renderInline(text) {
  const out = [];
  const pattern = /(\[\[([^\]]+)\]\])|(\*\*([^*]+)\*\*)|(`([^`]+)`)|(\[([^\]]+)\]\(([^)]+)\))/g;
  let last = 0, m;
  while ((m = pattern.exec(text)) !== null) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] !== undefined) {
      const title = m[2];
      out.push(el('span', { class: 'wiki-link', role: 'link', tabindex: '0',
        onclick: () => openWikiByTitle(title),
        onkeydown: e => { if (e.key === 'Enter') openWikiByTitle(title); } }, title));
    } else if (m[4] !== undefined) out.push(el('strong', {}, m[4]));
    else if (m[6] !== undefined) out.push(el('code', {}, m[6]));
    else if (m[8] !== undefined) {
      const href = m[9];
      // Only http(s) links become anchors; javascript: and data: stay as text.
      out.push(/^https?:\/\//i.test(href)
        ? el('a', { href: href, target: '_blank', rel: 'noopener noreferrer' }, m[8])
        : el('span', {}, m[8]));
    }
    last = pattern.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function renderMarkdown(source) {
  const frag = document.createDocumentFragment();
  let list = null;
  for (const raw of String(source).split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    const bullet = /^\s*[-*+]\s+(.*)$/.exec(line);
    const quote = /^\s*>\s?(.*)$/.exec(line);

    if (!bullet && list) { frag.append(list); list = null; }
    if (heading) {
      const level = Math.min(heading[1].length, 3);
      frag.append(el('h' + level, {}, renderInline(heading[2])));
    } else if (bullet) {
      if (!list) list = el('ul');
      list.append(el('li', {}, renderInline(bullet[1])));
    } else if (quote) {
      frag.append(el('blockquote', {}, renderInline(quote[1])));
    } else if (line.trim()) {
      frag.append(el('p', {}, renderInline(line)));
    }
  }
  if (list) frag.append(list);
  return frag;
}

/* ── Knowledge graph ───────────────────────────────────────────────
   A small force-directed layout on canvas. This replaces a 490KB
   vis-network bundle loaded from a CDN, whose string `title` fields were
   rendered as HTML — i.e. every memory's text was an XSS vector.
   Layout runs with cooling and then freezes, so an idle tab costs nothing. */

const graph = {
  nodes: [], edges: [], visible: new Set(['memory', 'wiki', 'document']),
  scale: 1, offsetX: 0, offsetY: 0,
  alpha: 0, running: false, hover: null, dragging: null, panning: null,
  canvas: null, ctx: null, dpr: 1, loaded: false,
};

function graphResize() {
  const canvas = graph.canvas;
  const rect = canvas.getBoundingClientRect();
  graph.dpr = window.devicePixelRatio || 1;
  canvas.width = Math.max(1, Math.round(rect.width * graph.dpr));
  canvas.height = Math.max(1, Math.round(rect.height * graph.dpr));
  graph.width = rect.width;
  graph.height = rect.height;
  graphDraw();
}

async function loadGraph() {
  if (!graph.canvas) return;
  $('#graph-hud').textContent = 'loading…';
  try {
    const data = await api('/api/graph?limit=250');
    const cx = graph.width / 2, cy = graph.height / 2;
    graph.nodes = (data.nodes || []).map((n, i) => {
      const angle = i * 2.399963, radius = 14 * Math.sqrt(i);
      return Object.assign({}, n, {
        x: cx + radius * Math.cos(angle), y: cy + radius * Math.sin(angle),
        vx: 0, vy: 0, r: 4 + Math.sqrt(n.weight || 4) * 1.8,
      });
    });
    const byId = new Map(graph.nodes.map(n => [n.id, n]));
    graph.edges = (data.edges || []).map(e => ({ source: byId.get(e.from), target: byId.get(e.to), kind: e.kind }))
      .filter(e => e.source && e.target);
    graph.loaded = true;
    const c = data.counts || {};
    $('#graph-hud').textContent = c.memories + ' memories · ' + c.wiki + ' wiki · ' +
      c.documents + ' docs · ' + graph.edges.length + ' links';
    graphReheat();
  } catch (err) {
    $('#graph-hud').textContent = 'error';
    toast('Graph: ' + err.message, 'err');
  }
}

function graphNodesVisible() { return graph.nodes.filter(n => graph.visible.has(n.group)); }

function graphReheat() { graph.alpha = 1; if (!graph.running) { graph.running = true; requestAnimationFrame(graphTick); } }

function graphTick() {
  const nodes = graphNodesVisible();
  const cx = graph.width / 2, cy = graph.height / 2;
  const alpha = graph.alpha;

  // Repulsion. O(n²) but n is capped server-side at 600, which is ~180k
  // cheap iterations — well inside a frame budget, and it stops entirely
  // once the layout cools.
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 === 0) { dx = Math.random() - 0.5; dy = Math.random() - 0.5; d2 = 0.25; }
      if (d2 > 90000) continue;
      const force = (1400 * alpha) / d2;
      const d = Math.sqrt(d2);
      a.vx += (dx / d) * force; a.vy += (dy / d) * force;
      b.vx -= (dx / d) * force; b.vy -= (dy / d) * force;
    }
  }

  for (const e of graph.edges) {
    if (!graph.visible.has(e.source.group) || !graph.visible.has(e.target.group)) continue;
    const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
    const d = Math.hypot(dx, dy) || 1;
    const force = (d - 90) * 0.012 * alpha;
    const fx = (dx / d) * force, fy = (dy / d) * force;
    e.source.vx += fx; e.source.vy += fy;
    e.target.vx -= fx; e.target.vy -= fy;
  }

  for (const n of nodes) {
    if (n === graph.dragging) { n.vx = n.vy = 0; continue; }
    n.vx += (cx - n.x) * 0.0016 * alpha;
    n.vy += (cy - n.y) * 0.0016 * alpha;
    n.vx *= 0.82; n.vy *= 0.82;
    n.x += n.vx; n.y += n.vy;
  }

  graph.alpha *= 0.975;
  graphDraw();
  if (graph.alpha > 0.005) requestAnimationFrame(graphTick);
  else graph.running = false;
}

function graphDraw() {
  const ctx = graph.ctx;
  if (!ctx) return;
  const css = getComputedStyle(document.documentElement);
  ctx.save();
  ctx.setTransform(graph.dpr, 0, 0, graph.dpr, 0, 0);
  ctx.clearRect(0, 0, graph.width, graph.height);
  ctx.translate(graph.offsetX, graph.offsetY);
  ctx.scale(graph.scale, graph.scale);

  ctx.lineWidth = 1 / graph.scale;
  ctx.strokeStyle = css.getPropertyValue('--border').trim() || '#ddd';
  ctx.globalAlpha = 0.75;
  ctx.beginPath();
  for (const e of graph.edges) {
    if (!graph.visible.has(e.source.group) || !graph.visible.has(e.target.group)) continue;
    ctx.moveTo(e.source.x, e.source.y);
    ctx.lineTo(e.target.x, e.target.y);
  }
  ctx.stroke();
  ctx.globalAlpha = 1;

  const inkColor = css.getPropertyValue('--ink-2').trim() || '#555';
  const surface = css.getPropertyValue('--surface').trim() || '#fff';
  const showLabels = graph.scale > 0.85;
  ctx.font = (11 / graph.scale).toFixed(2) + 'px ' + (css.getPropertyValue('--font') || 'sans-serif');
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';

  for (const n of graphNodesVisible()) {
    ctx.beginPath();
    if (n.group === 'memory') {
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    } else {
      const s = n.r * 1.6;
      ctx.rect(n.x - s / 2, n.y - s / 2, s, s);
    }
    ctx.fillStyle = n.color || '#94a3b8';
    ctx.fill();
    if (n === graph.hover) {
      ctx.lineWidth = 2.5 / graph.scale;
      ctx.strokeStyle = css.getPropertyValue('--ink').trim() || '#000';
      ctx.stroke();
    } else {
      ctx.lineWidth = 1.5 / graph.scale;
      ctx.strokeStyle = surface;
      ctx.stroke();
    }
    if (showLabels) {
      ctx.fillStyle = inkColor;
      ctx.fillText(n.label.length > 26 ? n.label.slice(0, 26) + '…' : n.label, n.x, n.y + n.r + 3 / graph.scale);
    }
  }
  ctx.restore();
}

function graphPointAt(event) {
  const rect = graph.canvas.getBoundingClientRect();
  return {
    x: (event.clientX - rect.left - graph.offsetX) / graph.scale,
    y: (event.clientY - rect.top - graph.offsetY) / graph.scale,
    clientX: event.clientX - rect.left, clientY: event.clientY - rect.top,
  };
}

function graphNodeAt(point) {
  const nodes = graphNodesVisible();
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.hypot(n.x - point.x, n.y - point.y) <= n.r + 4) return n;
  }
  return null;
}

function graphFit() {
  const nodes = graphNodesVisible();
  if (!nodes.length) return;
  const xs = nodes.map(n => n.x), ys = nodes.map(n => n.y);
  const minX = Math.min(...xs), maxX = Math.max(...xs);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const pad = 60;
  const scale = Math.min(
    graph.width / Math.max(1, maxX - minX + pad * 2),
    graph.height / Math.max(1, maxY - minY + pad * 2), 2.5);
  graph.scale = Math.max(0.12, scale);
  graph.offsetX = graph.width / 2 - ((minX + maxX) / 2) * graph.scale;
  graph.offsetY = graph.height / 2 - ((minY + maxY) / 2) * graph.scale;
  graphDraw();
}

function showGraphNodeDetail(node) {
  if (node.group === 'memory') { showMemoryDetail(node.meta.id); return; }
  if (node.group === 'wiki') { switchView('wiki'); openWikiPage(node.meta.id); return; }
  openDetail('Document', [
    detailRow('Path', node.meta.path, true),
    detailRow('Chunks', String(node.meta.chunks)),
    detailRow('Origin', node.meta.origin || 'note'),
  ], []);
}

function initGraphCanvas() {
  const canvas = $('#graph-canvas');
  graph.canvas = canvas;
  graph.ctx = canvas.getContext('2d');
  const tip = $('#graph-tip');

  new ResizeObserver(() => graphResize()).observe($('#graph-wrap'));

  canvas.addEventListener('mousedown', event => {
    const point = graphPointAt(event);
    const node = graphNodeAt(point);
    if (node) { graph.dragging = node; }
    else { graph.panning = { x: event.clientX - graph.offsetX, y: event.clientY - graph.offsetY }; }
    canvas.classList.add('dragging');
  });

  window.addEventListener('mousemove', event => {
    if (graph.dragging) {
      const point = graphPointAt(event);
      graph.dragging.x = point.x; graph.dragging.y = point.y;
      graphReheat();
      return;
    }
    if (graph.panning) {
      graph.offsetX = event.clientX - graph.panning.x;
      graph.offsetY = event.clientY - graph.panning.y;
      graphDraw();
      return;
    }
    if (!graph.canvas || !document.getElementById('view-graph').classList.contains('active')) return;
    const rect = canvas.getBoundingClientRect();
    if (event.clientX < rect.left || event.clientX > rect.right ||
        event.clientY < rect.top || event.clientY > rect.bottom) {
      if (graph.hover) { graph.hover = null; tip.style.display = 'none'; graphDraw(); }
      return;
    }
    const point = graphPointAt(event);
    const node = graphNodeAt(point);
    if (node !== graph.hover) {
      graph.hover = node;
      if (node) {
        // textContent, never innerHTML — node tooltips contain raw memory text.
        fill(tip, el('div', { class: 'tip-kind' }, node.group), el('div', {}, node.tooltip || node.label));
        tip.style.display = 'block';
        tip.style.left = Math.min(point.clientX + 14, graph.width - 330) + 'px';
        tip.style.top = (point.clientY + 14) + 'px';
      } else {
        tip.style.display = 'none';
      }
      graphDraw();
    } else if (node) {
      tip.style.left = Math.min(point.clientX + 14, graph.width - 330) + 'px';
      tip.style.top = (point.clientY + 14) + 'px';
    }
  });

  window.addEventListener('mouseup', event => {
    if (graph.dragging) {
      const point = graphPointAt(event);
      if (Math.hypot(point.x - graph.dragging.x, point.y - graph.dragging.y) < 3) showGraphNodeDetail(graph.dragging);
    }
    graph.dragging = null; graph.panning = null;
    canvas.classList.remove('dragging');
  });

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = event.clientX - rect.left, my = event.clientY - rect.top;
    const factor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
    const next = Math.min(3, Math.max(0.1, graph.scale * factor));
    graph.offsetX = mx - (mx - graph.offsetX) * (next / graph.scale);
    graph.offsetY = my - (my - graph.offsetY) * (next / graph.scale);
    graph.scale = next;
    graphDraw();
  }, { passive: false });

  graphResize();
}

  paletteIndex = 0;
  fill($('#palette-results'), paletteMatches.length
    ? paletteMatches.map((c, i) => el('li', {
        role: 'option', 'aria-selected': String(i === paletteIndex),
        onclick: () => runPaletteItem(i),
      }, c.label, el('span', { class: 'pal-hint' }, c.hint)))
    : el('li', { 'aria-selected': 'false' }, 'No matching command'));
}

function movePalette(delta) {
  if (!paletteMatches.length) return;
  paletteIndex = (paletteIndex + delta + paletteMatches.length) % paletteMatches.length;
  const items = $$('#palette-results li');
  items.forEach((li, i) => li.setAttribute('aria-selected', String(i === paletteIndex)));
  if (items[paletteIndex]) items[paletteIndex].scrollIntoView({ block: 'nearest' });
}

function runPaletteItem(index) {
  const command = paletteMatches[index];
  closeModal('palette-backdrop');
  if (command) command.run();
}

function setApiToken() {
  const current = localStorage.getItem(TOKEN_KEY) || '';
  const next = prompt('X-Amnis-Token for mutating requests (leave blank to clear):', current);
  if (next === null) return;
  if (next.trim()) { localStorage.setItem(TOKEN_KEY, next.trim()); toast('Token saved', 'ok'); }
  else { localStorage.removeItem(TOKEN_KEY); toast('Token cleared'); }
}

/* ── Theme ─────────────────────────────────────────────────────── */

const THEMES = ['system', 'light', 'dark'];

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('amnis.theme', theme);
  $('#theme-toggle').textContent = theme === 'light' ? '☀' : theme === 'dark' ? '☾' : '◐';
  $('#theme-toggle').title = 'Theme: ' + theme;
  if (graph.loaded) graphDraw();
}

function cycleTheme() {
  const current = localStorage.getItem('amnis.theme') || 'system';
  applyTheme(THEMES[(THEMES.indexOf(current) + 1) % THEMES.length]);
}

/* ── Views ─────────────────────────────────────────────────────── */

const VIEWS = {
  dashboard:   { title: 'Dashboard',   sub: 'Overview of every layer',            load: loadDashboard },
  memories:    { title: 'Memories',    sub: 'Everything Amnis remembers',         load: loadMemories },
  search:      { title: 'Search',      sub: 'Semantic and keyword search',        load: () => {} },
  graph:       { title: 'Graph',       sub: 'How memories, pages and docs relate', load: () => { if (!graph.loaded) loadGraph(); else graphDraw(); } },
  wiki:        { title: 'Wiki',        sub: 'Compiled knowledge pages',           load: loadWiki },
  episodes:    { title: 'Episodes',    sub: 'Logged conversation turns',          load: loadEpisodes },
  maintenance: { title: 'Maintenance', sub: 'Consolidation, pruning, indexing',   load: renderMaintenance },
};

let currentView = 'dashboard';

function switchView(name) {
  if (!VIEWS[name]) return;
  currentView = name;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.nav-btn').forEach(b => {
    if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#view-title').textContent = VIEWS[name].title;
  $('#view-sub').textContent = VIEWS[name].sub;
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);
  if (name === 'graph') requestAnimationFrame(() => { graphResize(); VIEWS[name].load(); });
  else VIEWS[name].load();
}

function refreshCurrentView() {
  if (currentView === 'graph') loadGraph();
  else VIEWS[currentView].load();
  if (currentView !== 'dashboard') loadDashboard();
}

async function compileWiki() {
  toast('Compiling wiki — this can take a while…');
  try {
    const result = await api('/api/compile-wiki', { method: 'POST', body: {} });
    toast('Compiled ' + result.compiled + ' pages', 'ok');
    if (currentView === 'wiki') loadWiki();
  } catch (err) { toast(err.message, 'err'); }
}

/* ── Wiring ────────────────────────────────────────────────────── */

function init() {
  applyTheme(localStorage.getItem('amnis.theme') || 'system');

  for (const cat of CATEGORIES) {
    $('#mem-category').append(el('option', { value: cat }, cat));
    $('#ed-category').append(el('option', { value: cat }, cat));
  }

  $$('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('#theme-toggle').addEventListener('click', cycleTheme);
  $('#new-memory-btn').addEventListener('click', () => openEditor(null));
  $('#open-palette').addEventListener('click', openPalette);

  $('#mem-search-btn').addEventListener('click', loadMemories);
  $('#mem-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadMemories(); });
  $('#mem-category').addEventListener('change', loadMemories);
  $('#mem-importance').addEventListener('change', loadMemories);
  $('#mem-clear-btn').addEventListener('click', () => {
    $('#mem-search').value = ''; $('#mem-category').value = ''; $('#mem-importance').value = '0';
    loadMemories();
  });

  $('#rag-search-btn').addEventListener('click', doSearch);
  $('#rag-query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  $$('#search-mode button').forEach(b => b.addEventListener('click', () => {
    searchMode = b.dataset.mode;
    $$('#search-mode button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if ($('#rag-query').value.trim()) doSearch();
  }));

  $$('#graph-filter button').forEach(b => b.addEventListener('click', () => {
    const on = b.getAttribute('aria-pressed') !== 'true';
    b.setAttribute('aria-pressed', String(on));
    if (on) graph.visible.add(b.dataset.group); else graph.visible.delete(b.dataset.group);
    graphReheat();
  }));
  $('#graph-fit').addEventListener('click', graphFit);
  $('#graph-reheat').addEventListener('click', graphReheat);
  $('#graph-refresh').addEventListener('click', loadGraph);

  $('#wiki-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadWiki(); });
  $('#wiki-compile-btn').addEventListener('click', compileWiki);
  $('#wiki-lint-btn').addEventListener('click', async () => {
    try {
      const result = await api('/api/wiki-lint');
      openDetail('Wiki lint', [
        detailRow('Pages checked', String(result.pages_checked)),
        detailRow('Issues found', String(result.issues_found)),
        ...(result.issues || []).slice(0, 40).map(i => detailRow(i.page, i.issue + ' — ' + i.detail)),
      ], []);
    } catch (err) { toast(err.message, 'err'); }
  });

  $('#episode-refresh').addEventListener('click', loadEpisodes);
  $('#episode-session').addEventListener('change', loadEpisodes);
  $('#episode-topic').addEventListener('keydown', e => { if (e.key === 'Enter') loadEpisodes(); });

  $('#ed-save').addEventListener('click', saveMemory);
  $('#ed-importance').addEventListener('input', e => { $('#ed-importance-out').textContent = e.target.value; });

  $$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
  $$('.modal-backdrop').forEach(backdrop => backdrop.addEventListener('mousedown', e => {
    if (e.target === backdrop) backdrop.classList.remove('open');
  }));

  const paletteInput = $('#palette-input');
  paletteInput.addEventListener('input', e => renderPalette(e.target.value));
  paletteInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(paletteIndex); }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') { $$('.modal-backdrop.open').forEach(m => m.classList.remove('open')); return; }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName);
    if (typing || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n') { e.preventDefault(); openEditor(null); }
    else if (e.key === 'r') { e.preventDefault(); refreshCurrentView(); }
    else if (e.key === '/') { e.preventDefault(); switchView('search'); $('#rag-query').focus(); }
    else if (e.key >= '1' && e.key <= '7') switchView(Object.keys(VIEWS)[Number(e.key) - 1]);
  });

  window.addEventListener('hashchange', () => switchView((location.hash || '#dashboard').slice(1)));

  initGraphCanvas();
  switchView((location.hash || '#dashboard').slice(1) in VIEWS ? (location.hash || '#dashboard').slice(1) : 'dashboard');
  loadDashboard();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
