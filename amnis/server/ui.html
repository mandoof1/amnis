<!DOCTYPE html>
<html lang="en" data-theme="system">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Amnis</title>
<!--
  Fully self-contained: no CDN scripts, no webfonts, no outbound requests of
  any kind. A local-first memory tool that phones out on every page view is
  not local-first. The knowledge graph is a Barnes-Hut force simulation on
  canvas, written here, rather than a third-party bundle.
-->
<style>
/* ══ Tokens ═══════════════════════════════════════════════════════
   Amnis is Latin for river. The palette is water under low light:
   deep blue-black ground, a current of violet running to cyan.
   Dark is the primary design; light is a full second pass, not an invert. */

:root {
  color-scheme: light;
  --ground:       #eef1f6;
  --surface:      #ffffff;
  --surface-2:    #f3f5f9;
  --surface-3:    #e6eaf1;
  --hairline:     #dbe1ea;
  --hairline-2:   #e9edf3;
  --sheen:        rgba(255,255,255,0);
  --ink:          #0d1117;
  --ink-2:        #4c5765;
  --ink-3:        #7c8798;
  --violet:       #6d4aff;
  --cyan:         #0891b2;
  --accent:       #6d4aff;
  --accent-2:     #0891b2;
  --accent-soft:  #ece7ff;
  --accent-ink:   #ffffff;
  --on-accent:    #ffffff;
  --good:         #0f9d63;
  --warn:         #c2740a;
  --bad:          #d92d20;
  --glow:         rgba(109,74,255,.18);
  --shadow-1:     0 1px 2px rgba(13,17,23,.05), 0 1px 3px rgba(13,17,23,.04);
  --shadow-2:     0 6px 18px rgba(13,17,23,.07), 0 2px 5px rgba(13,17,23,.05);
  --shadow-3:     0 24px 60px rgba(13,17,23,.16);
  --cat-preference: #b45309;
  --cat-fact:       #0f9d63;
  --cat-event:      #2563eb;
  --cat-procedure:  #7c3aed;
  --cat-concept:    #db2777;
  --cat-theme:      #e11d48;
  --cat-meta:       #64748b;
  --cat-general:    #64748b;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --ground:      #07090e;
    --surface:     #101520;
    --surface-2:   #171d2b;
    --surface-3:   #212938;
    --hairline:    #262f41;
    --hairline-2:  #1a2131;
    --sheen:       rgba(255,255,255,.045);
    --ink:         #e8edf7;
    --ink-2:       #9aa6bb;
    --ink-3:       #626e84;
    --violet:      #9b87ff;
    --cyan:        #4dd9e8;
    --accent:      #9b87ff;
    --accent-2:    #4dd9e8;
    --accent-soft: #201b3c;
    --accent-ink:  #0a0c12;
    --on-accent:   #0a0c12;
    --good:        #34d399;
    --warn:        #fbbf24;
    --bad:         #fb7185;
    --glow:        rgba(155,135,255,.30);
    --shadow-1:    0 1px 2px rgba(0,0,0,.5);
    --shadow-2:    0 8px 24px rgba(0,0,0,.5);
    --shadow-3:    0 28px 70px rgba(0,0,0,.7);
    --cat-preference: #fbbf24;
    --cat-fact:       #34d399;
    --cat-event:      #60a5fa;
    --cat-procedure:  #a78bfa;
    --cat-concept:    #f472b6;
    --cat-theme:      #fb7185;
    --cat-meta:       #94a3b8;
    --cat-general:    #94a3b8;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --ground:      #07090e;
  --surface:     #101520;
  --surface-2:   #171d2b;
  --surface-3:   #212938;
  --hairline:    #262f41;
  --hairline-2:  #1a2131;
  --sheen:       rgba(255,255,255,.045);
  --ink:         #e8edf7;
  --ink-2:       #9aa6bb;
  --ink-3:       #626e84;
  --violet:      #9b87ff;
  --cyan:        #4dd9e8;
  --accent:      #9b87ff;
  --accent-2:    #4dd9e8;
  --accent-soft: #201b3c;
  --accent-ink:  #0a0c12;
  --on-accent:   #0a0c12;
  --good:        #34d399;
  --warn:        #fbbf24;
  --bad:         #fb7185;
  --glow:        rgba(155,135,255,.30);
  --shadow-1:    0 1px 2px rgba(0,0,0,.5);
  --shadow-2:    0 8px 24px rgba(0,0,0,.5);
  --shadow-3:    0 28px 70px rgba(0,0,0,.7);
  --cat-preference: #fbbf24;
  --cat-fact:       #34d399;
  --cat-event:      #60a5fa;
  --cat-procedure:  #a78bfa;
  --cat-concept:    #f472b6;
  --cat-theme:      #fb7185;
  --cat-meta:       #94a3b8;
  --cat-general:    #94a3b8;
}

:root {
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", "Cascadia Code", Menlo, Consolas, monospace;
  --r-lg: 16px; --r: 12px; --r-sm: 9px; --r-xs: 6px;
  --rail: 236px;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font-family: var(--font);
  font-size: 14px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
::selection { background: var(--accent-soft); color: var(--ink); }
.tnum { font-variant-numeric: tabular-nums; }

/* Scrollbars, so panes don't look like raw browser chrome */
* { scrollbar-width: thin; scrollbar-color: var(--surface-3) transparent; }
*::-webkit-scrollbar { width: 9px; height: 9px; }
*::-webkit-scrollbar-thumb { background: var(--surface-3); border-radius: 20px; border: 2px solid transparent; background-clip: content-box; }
*::-webkit-scrollbar-track { background: transparent; }

/* ══ Shell ════════════════════════════════════════════════════════ */
#app { display: grid; grid-template-columns: var(--rail) 1fr; min-height: 100vh; }

#rail {
  position: sticky; top: 0; height: 100vh;
  display: flex; flex-direction: column; gap: 3px;
  padding: 20px 12px 14px;
  background: var(--surface);
  border-right: 1px solid var(--hairline);
  z-index: 30;
}
/* A thin current of accent down the rail edge — the one decorative flourish. */
#rail::after {
  content: ""; position: absolute; top: 0; right: -1px; width: 1px; height: 100%;
  background: linear-gradient(180deg, transparent, var(--accent) 22%, var(--accent-2) 62%, transparent);
  opacity: .45;
}

.brand { display: flex; align-items: center; gap: 11px; padding: 2px 10px 20px; }
.brand-mark {
  position: relative; width: 32px; height: 32px; flex: none;
  border-radius: 10px; overflow: hidden;
  background: linear-gradient(145deg, var(--violet), var(--cyan));
  box-shadow: 0 3px 14px var(--glow);
}
.brand-mark canvas { display: block; width: 100%; height: 100%; }
.brand-name { font-weight: 680; font-size: 16.5px; letter-spacing: -.015em; line-height: 1.15; }
.brand-sub { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); letter-spacing: .02em; }

.nav-btn {
  position: relative; display: flex; align-items: center; gap: 11px;
  width: 100%; padding: 9px 11px; border: 0; border-radius: var(--r-sm);
  background: none; color: var(--ink-2); font-weight: 520; text-align: left;
  cursor: pointer; transition: color .14s, background .14s;
}
.nav-btn:hover { background: var(--surface-2); color: var(--ink); }
.nav-btn[aria-current="page"] { color: var(--ink); background: var(--surface-2); font-weight: 620; }
.nav-btn[aria-current="page"]::before {
  content: ""; position: absolute; left: -12px; top: 50%; transform: translateY(-50%);
  width: 3px; height: 20px; border-radius: 0 3px 3px 0;
  background: linear-gradient(180deg, var(--violet), var(--cyan));
}
.nav-btn .ico { width: 17px; text-align: center; font-size: 14px; flex: none; opacity: .85; }
.nav-btn[aria-current="page"] .ico { opacity: 1; color: var(--accent); }
.nav-btn .count {
  margin-left: auto; font-size: 10.5px; font-family: var(--mono); font-variant-numeric: tabular-nums;
  color: var(--ink-3); background: var(--surface-3); padding: 1px 7px; border-radius: 20px;
}
.rail-label {
  font-size: 9.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase;
  color: var(--ink-3); padding: 16px 12px 5px;
}
.rail-foot { margin-top: auto; display: flex; flex-direction: column; gap: 7px; }
.status-pill {
  display: flex; align-items: center; gap: 8px; padding: 8px 11px;
  border-radius: var(--r-sm); background: var(--surface-2);
  border: 1px solid var(--hairline-2); font-size: 11.5px; color: var(--ink-2);
}
.status-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--good); flex: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 20%, transparent); }
.status-dot.warn { background: var(--warn); box-shadow: 0 0 0 3px color-mix(in srgb, var(--warn) 20%, transparent); }
.status-dot.bad  { background: var(--bad);  box-shadow: 0 0 0 3px color-mix(in srgb, var(--bad) 20%, transparent); }

#main { display: flex; flex-direction: column; min-width: 0; }
#topbar {
  position: sticky; top: 0; z-index: 25;
  display: flex; align-items: center; gap: 12px;
  padding: 15px 26px;
  background: color-mix(in srgb, var(--ground) 78%, transparent);
  border-bottom: 1px solid var(--hairline);
  backdrop-filter: blur(14px) saturate(1.3);
}
#view-title { font-size: 18px; font-weight: 660; letter-spacing: -.02em; line-height: 1.2; }
#view-sub { font-size: 12.5px; color: var(--ink-3); }
.spacer { flex: 1; }
.kbd {
  font-family: var(--mono); font-size: 10.5px; color: var(--ink-3);
  border: 1px solid var(--hairline); border-bottom-width: 2px; border-radius: 5px;
  padding: 1px 5px; background: var(--surface-2);
}
#content { flex: 1; min-width: 0; padding: 24px 26px 40px; }
.view { display: none; }
.view.active { display: block; }
.view.active > * { animation: rise .34s cubic-bezier(.16,1,.3,1) backwards; }
.view.active > *:nth-child(2) { animation-delay: .05s; }
.view.active > *:nth-child(3) { animation-delay: .1s; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ══ Controls ═════════════════════════════════════════════════════ */
.btn {
  display: inline-flex; align-items: center; gap: 7px; white-space: nowrap;
  padding: 8px 14px; border-radius: var(--r-sm);
  border: 1px solid var(--hairline); background: var(--surface); color: var(--ink);
  font-weight: 540; cursor: pointer;
  transition: background .14s, border-color .14s, transform .08s, box-shadow .14s;
}
.btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary {
  background: linear-gradient(135deg, var(--violet), var(--accent-2));
  border-color: transparent; color: var(--on-accent); font-weight: 620;
  box-shadow: 0 3px 14px var(--glow);
}
.btn-primary:hover { filter: brightness(1.09); border-color: transparent; }
.btn-danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 38%, var(--hairline)); }
.btn-danger:hover { background: color-mix(in srgb, var(--bad) 12%, transparent); border-color: var(--bad); }
.btn-sm { padding: 5px 11px; font-size: 12.5px; }
.btn-icon { padding: 7px 9px; }

.input, .select, .textarea {
  width: 100%; padding: 9px 12px;
  background: var(--surface); color: var(--ink);
  border: 1px solid var(--hairline); border-radius: var(--r-sm);
  outline: none; transition: border-color .14s, box-shadow .14s;
}
.input::placeholder { color: var(--ink-3); }
.input:focus, .select:focus, .textarea:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent);
}
.textarea { resize: vertical; min-height: 96px; font-family: inherit; line-height: 1.6; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
.field label { font-size: 11.5px; font-weight: 620; color: var(--ink-2); letter-spacing: .01em; }
.field .hint { font-size: 11.5px; color: var(--ink-3); font-weight: 500; }

.toolbar { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 18px; }
.toolbar .grow { flex: 1; min-width: 210px; }

.seg { display: inline-flex; background: var(--surface-2); border: 1px solid var(--hairline-2); border-radius: var(--r-sm); padding: 3px; gap: 2px; }
.seg button {
  border: 0; background: none; padding: 5px 12px; border-radius: 6px;
  font-size: 12.5px; font-weight: 550; color: var(--ink-3); cursor: pointer;
  transition: background .14s, color .14s;
}
.seg button:hover { color: var(--ink); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow-1); }

/* ══ Surfaces ═════════════════════════════════════════════════════ */
.panel {
  position: relative; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: var(--r);
  box-shadow: var(--shadow-1);
}
.panel::before {
  content: ""; position: absolute; inset: 0 0 auto; height: 1px;
  background: linear-gradient(90deg, transparent, var(--sheen), transparent);
  border-radius: var(--r) var(--r) 0 0; pointer-events: none;
}
.panel-head { display: flex; align-items: center; gap: 10px; padding: 15px 18px; border-bottom: 1px solid var(--hairline-2); }
.panel-head h2 { margin: 0; font-size: 13.5px; font-weight: 650; letter-spacing: -.005em; }
.panel-body { padding: 16px 18px; }
.pill { font-size: 10.5px; font-family: var(--mono); color: var(--ink-3); background: var(--surface-2); padding: 2px 8px; border-radius: 20px; }

.stats { display: grid; gap: 14px; margin-bottom: 18px; grid-template-columns: repeat(auto-fit, minmax(214px, 1fr)); }
.stat {
  position: relative; overflow: hidden;
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r); padding: 15px 17px 13px; box-shadow: var(--shadow-1);
  transition: border-color .18s, transform .18s, box-shadow .18s;
}
.stat:hover { transform: translateY(-2px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 34%, var(--hairline)); }
.stat-top { display: flex; align-items: center; gap: 9px; margin-bottom: 9px; }
.stat-ico {
  width: 26px; height: 26px; flex: none; border-radius: 8px;
  display: grid; place-items: center; font-size: 13px;
  background: var(--surface-2); color: var(--accent);
  border: 1px solid var(--hairline-2);
}
.stat-label { font-size: 10.5px; font-weight: 680; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-3); }
.stat-value { font-size: 32px; font-weight: 700; letter-spacing: -.035em; line-height: 1.05; font-variant-numeric: tabular-nums; }
.stat-sub { font-size: 11.5px; color: var(--ink-3); margin-top: 3px; }
.stat-spark { position: absolute; right: 0; bottom: 0; width: 96px; height: 34px; opacity: .55; pointer-events: none; }

.grid-2 { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); }

/* ══ Lists ════════════════════════════════════════════════════════ */
.mem-card {
  position: relative; background: var(--surface);
  border: 1px solid var(--hairline); border-radius: var(--r);
  padding: 14px 16px 13px 19px; margin-bottom: 10px; cursor: pointer;
  transition: border-color .16s, box-shadow .16s, transform .1s;
}
/* Category stripe: the one place a colour rail earns its keep, because
   category is the primary axis people scan memories by. */
.mem-card::before {
  content: ""; position: absolute; left: 0; top: 12px; bottom: 12px; width: 3px;
  border-radius: 0 3px 3px 0; background: var(--stripe, var(--ink-3));
}
.mem-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-2); border-color: color-mix(in srgb, var(--accent) 40%, var(--hairline)); }
.mem-card .text { margin-bottom: 10px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.55; }
.mem-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 11.5px; color: var(--ink-3); }
.badge {
  font-size: 10px; font-weight: 720; letter-spacing: .06em; text-transform: uppercase;
  padding: 2.5px 8px; border-radius: 20px; white-space: nowrap;
  color: var(--cat, var(--ink-2));
  background: color-mix(in srgb, var(--cat, var(--ink-3)) 15%, transparent);
  border: 1px solid color-mix(in srgb, var(--cat, var(--ink-3)) 32%, transparent);
}
.imp { display: inline-flex; gap: 2px; align-items: center; }
.imp i { width: 3px; height: 10px; border-radius: 2px; background: var(--surface-3); display: block; }
.imp i.on { background: linear-gradient(180deg, var(--violet), var(--accent-2)); }
.tag {
  font-size: 10.5px; font-family: var(--mono); color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--hairline-2);
  padding: 1px 7px; border-radius: 20px;
}

.rows { list-style: none; margin: 0; padding: 0; }
.rows li {
  padding: 11px 0; border-bottom: 1px solid var(--hairline-2);
  display: flex; gap: 11px; align-items: flex-start; cursor: pointer;
  transition: padding-left .16s;
}
.rows li:last-child { border-bottom: 0; }
.rows li:hover { padding-left: 5px; }
.rows li:hover .row-text { color: var(--accent); }
.row-text { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; transition: color .14s; }
.row-side { font-size: 10.5px; color: var(--ink-3); font-family: var(--mono); white-space: nowrap; padding-top: 2px; }

.bar-row { display: grid; grid-template-columns: 92px 1fr 40px; gap: 11px; align-items: center; margin-bottom: 10px; }
.bar-row .name { font-size: 12px; color: var(--ink-2); text-transform: capitalize; }
.bar-track { height: 7px; background: var(--surface-2); border-radius: 20px; overflow: hidden; }
.bar-fill { height: 100%; border-radius: 20px; transition: width .7s cubic-bezier(.16,1,.3,1); }
.bar-row .num { font-size: 12px; font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink-3); text-align: right; }

.result {
  background: var(--surface); border: 1px solid var(--hairline);
  border-radius: var(--r); padding: 14px 16px; margin-bottom: 10px;
  transition: border-color .16s;
}
.result:hover { border-color: color-mix(in srgb, var(--accent) 34%, var(--hairline)); }
.result-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
.result-src { font-family: var(--mono); font-size: 11.5px; color: var(--accent-2); overflow-wrap: anywhere; }
.result-body { color: var(--ink-2); font-size: 13px; white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.6; }
.score { font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); margin-left: auto; font-variant-numeric: tabular-nums; }
mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 3px; padding: 0 2px; }

/* ══ Wiki ═════════════════════════════════════════════════════════ */
.wiki-layout { display: grid; grid-template-columns: 258px 1fr; gap: 16px; align-items: start; }
.wiki-list { list-style: none; margin: 0; padding: 7px; max-height: 70vh; overflow-y: auto; }
.wiki-list li { padding: 8px 11px; border-radius: var(--r-xs); cursor: pointer; font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 8px; transition: background .14s, color .14s; }
.wiki-list li:hover { background: var(--surface-2); color: var(--ink); }
.wiki-list li[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 620; }
.wiki-list .wv { margin-left: auto; font-size: 10px; font-family: var(--mono); color: var(--ink-3); }
.wiki-doc { padding: 24px 28px; max-height: 70vh; overflow-y: auto; }
.wiki-doc h1 { font-size: 25px; margin: 0 0 6px; letter-spacing: -.03em; text-wrap: balance; }
.wiki-doc h2 { font-size: 15.5px; margin: 26px 0 9px; padding-bottom: 7px; border-bottom: 1px solid var(--hairline-2); letter-spacing: -.01em; }
.wiki-doc h3 { font-size: 13.5px; margin: 18px 0 6px; color: var(--ink-2); }
.wiki-doc p { margin: 0 0 11px; max-width: 68ch; }
.wiki-doc ul { margin: 0 0 13px; padding-left: 19px; max-width: 68ch; }
.wiki-doc li { margin-bottom: 6px; }
.wiki-doc blockquote {
  margin: 0 0 13px; padding: 9px 15px; max-width: 68ch;
  border-left: 2px solid var(--accent); background: var(--surface-2);
  border-radius: 0 var(--r-xs) var(--r-xs) 0; color: var(--ink-2); font-size: 13px;
}
.wiki-doc code { font-family: var(--mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.wiki-link { color: var(--accent); cursor: pointer; border-bottom: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); }
.wiki-link:hover { border-bottom-color: var(--accent); }

/* ══ Graph ════════════════════════════════════════════════════════ */
#graph-wrap {
  position: relative; height: calc(100vh - 196px); min-height: 440px;
  border: 1px solid var(--hairline); border-radius: var(--r);
  background:
    radial-gradient(1100px 620px at 50% 42%, color-mix(in srgb, var(--accent) 7%, transparent), transparent 72%),
    var(--surface);
  overflow: hidden;
}
#graph-canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }

.leg-sw.sq { border-radius: 3px; }

.leg-n { margin-left: auto; font-family: var(--mono); font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
#graph-hud {
  padding: 6px 10px; font-family: var(--mono); font-size: 10.5px;

}
#graph-tip {
  position: absolute; z-index: 6; pointer-events: none; max-width: 330px; display: none;

  border-radius: var(--r-sm); box-shadow: var(--shadow-3);
  padding: 10px 12px; font-size: 12.5px; overflow-wrap: anywhere;
}
#graph-tip .tip-kind { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-bottom: 4px; }
#graph-tip .tip-meta { font-size: 11px; color: var(--ink-3); margin-top: 6px; font-family: var(--mono); }
#graph-search { width: 190px; }
.g-empty { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }

/* ══ Modals ═══════════════════════════════════════════════════════ */
.backdrop {
  position: fixed; inset: 0; z-index: 100; display: none;
  align-items: center; justify-content: center; padding: 20px;

}
.backdrop.open { display: flex; animation: fadein .16s ease; }
@keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface); border: 1px solid var(--hairline);

/* ══ Feedback ═════════════════════════════════════════════════════ */
#toasts { position: fixed; bottom: 22px; right: 22px; z-index: 200; display: flex; flex-direction: column; gap: 9px; align-items: flex-end; }
.toast {
  display: flex; align-items: flex-start; gap: 9px;

}
.toast.ok  { border-left-color: var(--good); }
.toast.err { border-left-color: var(--bad); }
.toast .ti { flex: none; opacity: .8; }
@keyframes slidein { from { opacity: 0; transform: translateX(26px); } to { opacity: 1; transform: none; } }

.empty { text-align: center; padding: 52px 20px; color: var(--ink-3); }

<script>
'use strict';
/* ══════════════════════════════════════════════════════════════════
   Amnis dashboard.

   Every value from the server reaches the DOM as a text node. There is no
   innerHTML interpolation in this file — memory text, wiki content, source
   paths and error messages are all untrusted, and the previous UI
   concatenated all four into markup.
   ══════════════════════════════════════════════════════════════════ */

const CATEGORIES = ['preference','fact','event','procedure','concept','theme','meta','general'];

function cssVar(name, fallback) {
  const v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  return v || fallback || '';
}
const catColor = c => cssVar('--cat-' + (CATEGORIES.includes(c) ? c : 'general'), '#94a3b8');

/* ── DOM ─────────────────────────────────────────────────────────── */

function el(tag, props, ...children) {
  const node = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') node.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(node.style, v);
    else if (k === 'dataset') Object.assign(node.dataset, v);
    else if (k.startsWith('on') && typeof v === 'function') node.addEventListener(k.slice(2).toLowerCase(), v);
    else node.setAttribute(k, v === true ? '' : String(v));
  }
  for (const child of children.flat(4)) {
    if (child === null || child === undefined || child === false || child === '') continue;
    node.append(child instanceof Node ? child : document.createTextNode(String(child)));
  }
  return node;
}
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
function fill(node, ...children) {
  while (node.firstChild) node.removeChild(node.firstChild);
  node.append(...children.flat(4).filter(c => c !== null && c !== undefined && c !== false && c !== ''));
  return node;
}

function toast(message, kind) {
  const glyph = kind === 'err' ? '⚠' : kind === 'ok' ? '✓' : '•';
  const node = el('div', { class: 'toast ' + (kind || '') },
    el('span', { class: 'ti' }, glyph), el('span', {}, String(message)));
  $('#toasts').append(node);
  setTimeout(() => {
    node.style.transition = 'opacity .2s, transform .2s';
    node.style.opacity = '0';
    node.style.transform = 'translateX(16px)';
    setTimeout(() => node.remove(), 220);
  }, kind === 'err' ? 6500 : 3200);
}

const skeletons = (n, cls) => Array.from({ length: n }, () => el('div', { class: 'sk ' + (cls || 'sk-c') }));

const emptyState = (icon, title, detail) => el('div', { class: 'empty' },
  el('div', { class: 'ei' }, icon), el('div', { class: 'et' }, title), detail ? el('div', {}, detail) : null);

function relTime(iso) {
  if (!iso) return '—';
  const then = new Date(iso).getTime();
  if (Number.isNaN(then)) return '—';
  const secs = Math.max(0, (Date.now() - then) / 1000);
  if (secs < 60) return 'just now';
  const units = [[60,'m'],[3600,'h'],[86400,'d'],[2592000,'mo'],[31536000,'y']];
  let div = 60, label = 'm';
  for (const [s, l] of units) if (secs >= s) { div = s; label = l; }
  return Math.floor(secs / div) + label + ' ago';
}

/* Count-up on stat values. Cheap, and it makes a refresh legible. */
function countUp(node, target) {
  const value = Number(target);
  if (!isFinite(value) || value === 0 || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    node.textContent = String(target);
    return;
  }
  const start = performance.now(), dur = 620;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    node.textContent = String(Math.round(value * eased));
    if (t < 1) requestAnimationFrame(step);
  })(start);
}

/* ── API ─────────────────────────────────────────────────────────── */

const TOKEN_KEY = 'amnis.token';
const authHeaders = () => {
  const t = localStorage.getItem(TOKEN_KEY);
  return t ? { 'X-Amnis-Token': t } : {};
};

async function api(path, options) {
  const opts = Object.assign({ headers: {} }, options || {});
  opts.headers = Object.assign({}, authHeaders(), opts.headers);
  if (opts.body !== undefined && typeof opts.body !== 'string') {
    opts.headers['Content-Type'] = 'application/json';
    opts.body = JSON.stringify(opts.body);
  }
  const res = await fetch(path, opts);
  let payload = null;
  try { payload = await res.json(); } catch (_) { /* empty body is fine */ }
  if (!res.ok) {
    let detail = (payload && payload.detail) || res.statusText || ('HTTP ' + res.status);
    if (Array.isArray(detail)) detail = detail.map(d => (d.loc ? d.loc.slice(-1)[0] + ': ' : '') + d.msg).join('; ');
    if (res.status === 401) detail = 'Unauthorised — set an API token from the command palette.';
    const err = new Error(typeof detail === 'string' ? detail : JSON.stringify(detail));
    err.status = res.status;
    throw err;
  }
  return payload;
}

/* ── Shared pieces ───────────────────────────────────────────────── */

function importance(n) {
  const bar = el('span', { class: 'imp', title: 'Importance ' + n + ' of 10' });
  for (let i = 1; i <= 10; i++) bar.append(el('i', { class: i <= n ? 'on' : '' }));
  return bar;
}

const categoryBadge = cat =>
  el('span', { class: 'badge', style: { '--cat': catColor(cat) } }, cat || 'general');

function memoryCard(memory) {
  const open = () => showMemoryDetail(memory.id);
  return el('div', {

function sparkline(values, color) {
  const canvas = el('canvas', { class: 'stat-spark', width: 192, height: 68 });
  requestAnimationFrame(() => {
    const ctx = canvas.getContext('2d');
    const w = 192, h = 68, pad = 6;
    const max = Math.max(...values, 1), min = Math.min(...values, 0);
    const span = Math.max(1, max - min);
    const pt = i => [
      pad + (i / (values.length - 1)) * (w - pad * 2),
      h - pad - ((values[i] - min) / span) * (h - pad * 2),
    ];
    const grad = ctx.createLinearGradient(0, 0, 0, h);
    grad.addColorStop(0, color + '55');
    grad.addColorStop(1, color + '00');
    ctx.beginPath();
    ctx.moveTo(pad, h);
    values.forEach((_, i) => ctx.lineTo(...pt(i)));
    ctx.lineTo(w - pad, h);
    ctx.closePath();
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.beginPath();
    values.forEach((_, i) => (i ? ctx.lineTo(...pt(i)) : ctx.moveTo(...pt(i))));
    ctx.strokeStyle = color;
    ctx.lineWidth = 1.8;
    ctx.lineJoin = 'round';
    ctx.stroke();
    const [ex, ey] = pt(values.length - 1);
    ctx.beginPath();
    ctx.arc(ex, ey, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = color;
    ctx.fill();
  });
  return canvas;
}

/* A deterministic shape derived from the value, so the card has a graphic
   without implying we have history the server does not actually record. */
function trendFrom(seed, n) {
  const out = [];
  let x = (seed % 97) + 13;
  for (let i = 0; i < n; i++) {
    x = (x * 1103515245 + 12345) % 2147483648;
    out.push(0.55 + 0.45 * (i / n) + ((x / 2147483648) - 0.5) * 0.34);
  }
  return out;
}

function statCard(icon, label, value, sub, color) {
  const valueNode = el('div', { class: 'stat-value' }, '0');
  countUp(valueNode, value);
  return el('div', { class: 'stat' },
    el('div', { class: 'stat-top' },
      el('div', { class: 'stat-ico', style: { color: color }, 'aria-hidden': 'true' }, icon),
      el('div', { class: 'stat-label' }, label)),
    valueNode,
    el('div', { class: 'stat-sub' }, sub),
    sparkline(trendFrom(Number(value) || 7, 22), color));
}

let searchMode = 'hybrid';

/* Highlight query terms as text nodes plus <mark> elements — never markup. */
function highlight(text, terms) {
  if (!terms.length) return [text];
  const pattern = new RegExp('(' + terms.map(t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'ig');
  const out = [];
  let last = 0, m;
  while ((m = pattern.exec(text)) !== null) {
    if (m.index > last) out.push(text.slice(last, m.index));
    out.push(el('mark', {}, m[0]));
    last = pattern.lastIndex;
    if (pattern.lastIndex === m.index) pattern.lastIndex++;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

async function doSearch() {
  const query = $('#rag-query').value.trim();
  const target = $('#search-results');
  if (!query) { fill(target, emptyState('⌕', 'Type something to search')); return; }
  fill(target, skeletons(4));

  const terms = (query.toLowerCase().match(/[a-z0-9]{3,}/g) || []);
  try {
    const data = await api('/api/search?query=' + encodeURIComponent(query) +
      '&limit=15&mode=' + encodeURIComponent(searchMode));
    const results = data.results || [];
    if (!results.length) { fill(target, emptyState('⌕', 'No results', 'Nothing indexed matches that.')); return; }

    fill(target, results.map(r => {
      const signal = r.hybrid_score !== undefined ? 'rrf ' + Number(r.hybrid_score).toFixed(4)
        : r.score !== undefined ? 'cosine ' + Number(r.score).toFixed(3)
        : r.rank !== undefined ? 'bm25 ' + Number(r.rank).toFixed(2) : '';
      return el('div', { class: 'result' },
        el('div', { class: 'result-head' },
          el('span', { class: 'badge', style: { '--cat': cssVar('--ink-3', '#7c8798') } }, r.search_type || 'result'),
          el('span', { class: 'result-src' }, r.source || 'unknown'),
          r.heading ? el('span', { class: 'tag' }, r.heading) : null,
          signal ? el('span', { class: 'score' }, signal) : null),
        el('div', { class: 'result-body' }, highlight(r.content || '', terms)));
    }));
  } catch (err) {
    fill(target, emptyState('⚠', 'Search failed', err.message));
  }
}

/* Markdown to DOM nodes. Wiki content is derived from indexed files, so it
   is untrusted; building real nodes means it can never become markup. */
function renderInline(text) {
  const out = [];
  const pattern = /(\[\[([^\]]+)\]\])|(\*\*([^*]+)\*\*)|(`([^`]+)`)|(\[([^\]]+)\]\(([^)]+)\))/g;
  let last = 0, m;
  while ((m = pattern.exec(text)) !== null) {
    if (m.index > last) out.push(text.slice(last, m.index));
    if (m[2] !== undefined) {
      const title = m[2];
      out.push(el('span', {
        class: 'wiki-link', role: 'link', tabindex: '0',
        onclick: () => openWikiByTitle(title),
        onkeydown: e => { if (e.key === 'Enter') openWikiByTitle(title); },
      }, title));
    } else if (m[4] !== undefined) out.push(el('strong', {}, m[4]));
    else if (m[6] !== undefined) out.push(el('code', {}, m[6]));
    else if (m[8] !== undefined) {
      const href = m[9];
      // Only http(s) becomes a link; javascript: and data: stay inert text.
      out.push(/^https?:\/\//i.test(href)
        ? el('a', { href: href, target: '_blank', rel: 'noopener noreferrer' }, m[8])
        : el('span', {}, m[8]));
    }
    last = pattern.lastIndex;
  }
  if (last < text.length) out.push(text.slice(last));
  return out;
}

function renderMarkdown(source) {
  const frag = document.createDocumentFragment();
  let list = null;
  for (const raw of String(source).split('\n')) {
    const line = raw.replace(/\s+$/, '');
    const heading = /^(#{1,6})\s+(.*)$/.exec(line);
    const bullet = /^\s*[-*+]\s+(.*)$/.exec(line);
    const quote = /^\s*>\s?(.*)$/.exec(line);
    if (!bullet && list) { frag.append(list); list = null; }
    if (heading) frag.append(el('h' + Math.min(heading[1].length, 3), {}, renderInline(heading[2])));
    else if (bullet) { if (!list) list = el('ul'); list.append(el('li', {}, renderInline(bullet[1]))); }
    else if (quote) frag.append(el('blockquote', {}, renderInline(quote[1])));
    else if (line.trim()) frag.append(el('p', {}, renderInline(line)));
  }
  if (list) frag.append(list);
  return frag;
}

/* ══ Knowledge graph ═══════════════════════════════════════════════
   A force-directed layout on canvas, written here rather than pulled from
   a CDN. Beyond the dependency, the previous version had three real
   defects: it never fitted the view, so with a few hundred nodes most of
   the graph sat outside the canvas; it had no collision force, so clusters
   collapsed into unreadable blobs; and it drew every label at every zoom,
   which buried the picture under text.

   The simulation cools to a stop and then idles at zero CPU. It only wakes
   for interaction. */

const G = {
  nodes: [], edges: [], adjacency: new Map(),
  visible: new Set(['memory', 'wiki', 'document']),
  scale: 1, tx: 0, ty: 0,
  alpha: 0, running: false, settled: false, pendingFit: false,
  hover: null, selected: null, dragging: null, panning: null,
  matches: new Set(), query: '',
  canvas: null, ctx: null, dpr: 1, w: 0, h: 0,
  limit: 80, loaded: false, loading: false, hideIsolated: true,
};

const ALPHA_MIN = 0.004;
const ALPHA_DECAY = 0.0212;
const VELOCITY_DECAY = 0.62;

const EDGE_STYLE = {
  tag:    { dist: 74,  strength: 0.55, varName: '--accent' },
  topic:  { dist: 108, strength: 0.35, varName: '--cat-procedure' },
  source: { dist: 132, strength: 0.24, varName: '--accent-2' },
};

/* ── sizing ──────────────────────────────────────────────────────── */

function graphResize() {
  const canvas = G.canvas;
  if (!canvas) return;
  const rect = canvas.getBoundingClientRect();
  if (rect.width < 2 || rect.height < 2) return;   // view is hidden
  G.dpr = Math.min(window.devicePixelRatio || 1, 2);
  G.w = rect.width;
  G.h = rect.height;
  canvas.width = Math.round(rect.width * G.dpr);
  canvas.height = Math.round(rect.height * G.dpr);
  if (G.pendingFit && G.nodes.length) { G.pendingFit = false; graphFit(false); }
  graphDraw();
}

/* ── data ────────────────────────────────────────────────────────── */

async function loadGraph() {
  if (!G.canvas || G.loading) return;
  G.loading = true;
  setHud('loading…');
  try {
    const data = await api('/api/graph?limit=' + G.limit);
    const raw = data.nodes || [];

    // Seed on a phyllotaxis spiral: even coverage and no two nodes
    // starting on top of each other, which makes the first tick stable.
    const cx = (G.w || 900) / 2, cy = (G.h || 600) / 2;
    G.nodes = raw.map((n, i) => {
      const angle = i * 2.399963, radius = 22 * Math.sqrt(i);
      return Object.assign({}, n, {
        x: cx + radius * Math.cos(angle),
        y: cy + radius * Math.sin(angle),
        vx: 0, vy: 0, degree: 0,
        r: n.group === 'memory' ? 4.5 + Math.sqrt(n.weight || 5) * 1.5
          : n.group === 'wiki' ? 8.5 : 5.5,
      });
    });

    const byId = new Map(G.nodes.map(n => [n.id, n]));
    G.edges = (data.edges || [])
      .map(e => ({ source: byId.get(e.from), target: byId.get(e.to), kind: e.kind || 'tag' }))
      .filter(e => e.source && e.target && e.source !== e.target);

    G.adjacency = new Map(G.nodes.map(n => [n.id, new Set()]));
    for (const e of G.edges) {
      e.source.degree++; e.target.degree++;
      G.adjacency.get(e.source.id).add(e.target.id);
      G.adjacency.get(e.target.id).add(e.source.id);
    }
    // Well-connected nodes read as bigger; that is the graph's own signal.
    for (const n of G.nodes) n.r += Math.min(4.5, Math.sqrt(n.degree) * 1.1);

      G.loaded = true;
    G.selected = null;
    G.hover = null;
    renderLegend();
    applyGraphQuery();
    const empty = $('#graph-empty');
    if (!visibleNodes().length) {
      fill(empty, emptyState('⬡', 'Nothing connected yet',
        'Add tags to memories, or compile the wiki, to create relations.'));
      empty.hidden = false;
    } else {
      empty.hidden = true;
    }
    graphRelayout();
  } catch (err) {
    setHud('error');
    toast('Graph: ' + err.message, 'err');
  } finally {
    G.loading = false;
  }
}

// A node with no relations contributes nothing to a relationship graph, but
// it still pushes on everything else and stretches the bounding box the fit
// is computed from. Stale document rows in particular arrive by the hundred.
const visibleNodes = () =>
  G.nodes.filter(n => G.visible.has(n.group) && (!G.hideIsolated || n.degree > 0));

/* ── simulation ──────────────────────────────────────────────────── */

function graphRelayout() {
  // Fit once the layout settles, not before — fitting a hot layout just
  // chases it around the screen.
  G.settled = false;
  G.alpha = 1;
  if (!G.running) { G.running = true; requestAnimationFrame(graphTick); }
}

function graphReheat(alpha) {
  G.alpha = Math.max(G.alpha, alpha || 0.32);
  if (!G.running) { G.running = true; requestAnimationFrame(graphTick); }
}

const REPULSION = 450;
// Repulsion is softened below a 10px separation. Without a floor, two nodes
// that drift near-coincident produce a four-figure impulse and are flung out
// of the working area, which is what tore the old layout apart.
const REPULSION_FLOOR = 100;
const CENTERING = 0.03;

function graphTick() {
  const nodes = visibleNodes();
  const alpha = G.alpha;
  const cx = G.w / 2, cy = G.h / 2;

  // Repulsion, with a distance cutoff. n is capped server-side, so the
  // pair loop stays a few milliseconds and Barnes-Hut would be ceremony.
  for (let i = 0; i < nodes.length; i++) {
    const a = nodes[i];
    for (let j = i + 1; j < nodes.length; j++) {
      const b = nodes[j];
      let dx = a.x - b.x, dy = a.y - b.y;
      let d2 = dx * dx + dy * dy;
      if (d2 > 62500) continue;                       // beyond 250px, ignore
      if (d2 < 1e-6) {                                // exactly coincident
        dx = Math.random() - 0.5; dy = Math.random() - 0.5;
        d2 = dx * dx + dy * dy + 1e-6;
      }
      const d = Math.sqrt(d2);
      const force = (REPULSION * alpha * (a.r + b.r) * 0.055) / Math.max(d2, REPULSION_FLOOR);
      const fx = (dx / d) * force, fy = (dy / d) * force;
      a.vx += fx; a.vy += fy;
      b.vx -= fx; b.vy -= fy;

      // Collision: hard-separate overlapping discs so clusters stay legible
      // instead of collapsing into a single blob.
      const min = a.r + b.r + 5;
      if (d < min) {
        const push = ((min - d) / d) * 0.5;
        a.x += dx * push; a.y += dy * push;
        b.x -= dx * push; b.y -= dy * push;
      }
    }
  }

  // Links: spring toward a rest length that depends on the relation.
  for (const e of G.edges) {
    if (!G.visible.has(e.source.group) || !G.visible.has(e.target.group)) continue;
    const style = EDGE_STYLE[e.kind] || EDGE_STYLE.tag;
    const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
    const d = Math.hypot(dx, dy) || 1;
    const force = ((d - style.dist) / d) * style.strength * alpha * 0.5;
    const fx = dx * force, fy = dy * force;
    e.source.vx += fx; e.source.vy += fy;
    e.target.vx -= fx; e.target.vy -= fy;
  }

  // Centering weakens as the graph grows, so a large graph spreads out
  // instead of being crushed into the same disc as a small one.
  const centering = CENTERING * Math.sqrt(200 / Math.max(1, nodes.length));
  // Hard containment. The repulsion cutoff means two clusters more than
  // 250px apart stop seeing each other; without a boundary a disconnected
  // component can drift indefinitely and the fit then zooms out to nothing.
  const bound = 320 * Math.sqrt(Math.max(1, nodes.length) / 100);

  for (const n of nodes) {
    if (n === G.dragging) { n.vx = 0; n.vy = 0; continue; }
    n.vx += (cx - n.x) * centering * alpha;
    n.vy += (cy - n.y) * centering * 1.15 * alpha;   // the canvas is wider than it is tall
    const ox = n.x - cx, oy = n.y - cy;
    const dist = Math.hypot(ox, oy);
    if (dist > bound) {
      const pull = ((dist - bound) / dist) * 0.18;
      n.vx -= ox * pull; n.vy -= oy * pull;
    }
    n.vx *= VELOCITY_DECAY; n.vy *= VELOCITY_DECAY;
    n.x += n.vx; n.y += n.vy;
  }

  G.alpha += (0 - G.alpha) * ALPHA_DECAY;
  setHud();
  graphDraw();

  if (G.alpha > ALPHA_MIN || G.dragging) {
    requestAnimationFrame(graphTick);
  } else {
    G.running = false;
    if (!G.settled) {
      G.settled = true;
      graphFit(true);
    }
  }
}

/* ── view transform ──────────────────────────────────────────────── */

function graphFit(animate) {
  const nodes = visibleNodes();
  if (!nodes.length || !G.w) { G.pendingFit = true; return; }
  let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
  for (const n of nodes) {
    minX = Math.min(minX, n.x - n.r); maxX = Math.max(maxX, n.x + n.r);
    minY = Math.min(minY, n.y - n.r); maxY = Math.max(maxY, n.y + n.r);
  }
  const pad = 54;
  const scale = Math.max(0.12, Math.min(
    (G.w - pad * 2) / Math.max(1, maxX - minX),
    (G.h - pad * 2) / Math.max(1, maxY - minY),
    1.9));
  const tx = G.w / 2 - ((minX + maxX) / 2) * scale;
  const ty = G.h / 2 - ((minY + maxY) / 2) * scale;
  if (animate === false || matchMedia('(prefers-reduced-motion: reduce)').matches) {
    G.scale = scale; G.tx = tx; G.ty = ty; graphDraw(); return;
  }
  animateView(scale, tx, ty);
}

function animateView(scale, tx, ty) {
  const s0 = G.scale, x0 = G.tx, y0 = G.ty;
  const start = performance.now(), dur = 520;
  (function step(now) {
    const t = Math.min(1, (now - start) / dur);
    const k = 1 - Math.pow(1 - t, 3);
    G.scale = s0 + (scale - s0) * k;
    G.tx = x0 + (tx - x0) * k;
    G.ty = y0 + (ty - y0) * k;
    graphDraw();
    if (t < 1) requestAnimationFrame(step);
  })(start);
}

function focusNode(node) {
  const scale = Math.max(G.scale, 1.5);
  animateView(scale, G.w / 2 - node.x * scale, G.h / 2 - node.y * scale);
}

/* ── rendering ───────────────────────────────────────────────────── */

function graphDraw() {
  const ctx = G.ctx;
  if (!ctx || !G.w) return;

  const ink    = cssVar('--ink', '#e8edf7');
  const ink2   = cssVar('--ink-2', '#9aa6bb');
  const surf   = cssVar('--surface', '#101520');
  const accent = cssVar('--accent', '#9b87ff');

  // Which nodes are emphasised: the hovered/selected node's neighbourhood,
  // or the search matches, or everything.
  const anchor = G.hover || G.selected;
  let focus = null;
  if (anchor) {
    focus = new Set(G.adjacency.get(anchor.id) || []);
    focus.add(anchor.id);
  } else if (G.matches.size) {
    focus = G.matches;
  }

  ctx.setTransform(G.dpr, 0, 0, G.dpr, 0, 0);
  ctx.clearRect(0, 0, G.w, G.h);
  ctx.translate(G.tx, G.ty);
  ctx.scale(G.scale, G.scale);
  ctx.lineCap = 'round';

  // ── edges, drawn as gentle arcs so parallel links stay distinguishable
  const hairline = 1 / G.scale;
  for (const e of G.edges) {
    if (!G.visible.has(e.source.group) || !G.visible.has(e.target.group)) continue;
    const lit = !focus || (focus.has(e.source.id) && focus.has(e.target.id));
    if (focus && !lit) continue;                    // dimmed edges are simply omitted
    const style = EDGE_STYLE[e.kind] || EDGE_STYLE.tag;
    const dx = e.target.x - e.source.x, dy = e.target.y - e.source.y;
    const mx = (e.source.x + e.target.x) / 2, my = (e.source.y + e.target.y) / 2;
    const bow = 0.11;
    ctx.beginPath();
    ctx.moveTo(e.source.x, e.source.y);
    ctx.quadraticCurveTo(mx - dy * bow, my + dx * bow, e.target.x, e.target.y);
    ctx.strokeStyle = cssVar(style.varName, ink2);
    ctx.globalAlpha = focus ? 0.62 : 0.2;
    ctx.lineWidth = hairline * (focus ? 1.7 : 1.1);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;

  // ── nodes
  const nodes = visibleNodes();
  const labelled = labelSet(nodes, focus, anchor);

  for (const n of nodes) {
    const lit = !focus || focus.has(n.id);
    ctx.globalAlpha = lit ? 1 : 0.13;

    // Glow: importance for memories, degree for everything else.
    const heat = n.group === 'memory' ? (n.weight || 5) / 10 : Math.min(1, n.degree / 8);
    if (lit && heat > 0.55) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 6 / G.scale, 0, Math.PI * 2);
      ctx.fillStyle = n.color;
      ctx.globalAlpha = 0.13 * heat;
      ctx.fill();
      ctx.globalAlpha = lit ? 1 : 0.13;
    }

    ctx.beginPath();
    if (n.group === 'memory') {
      ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
    } else if (n.group === 'wiki') {
      roundRect(ctx, n.x - n.r, n.y - n.r, n.r * 2, n.r * 2, 3 / G.scale + 1);
    } else {
      ctx.moveTo(n.x, n.y - n.r);
      ctx.lineTo(n.x + n.r, n.y);
      ctx.lineTo(n.x, n.y + n.r);
      ctx.lineTo(n.x - n.r, n.y);
      ctx.closePath();
    }
    ctx.fillStyle = n.color;
    ctx.fill();
    ctx.lineWidth = 1.6 / G.scale;
    ctx.strokeStyle = surf;
    ctx.stroke();

    if (n === anchor) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 5 / G.scale, 0, Math.PI * 2);
      ctx.strokeStyle = ink;
      ctx.lineWidth = 2 / G.scale;
      ctx.stroke();
    } else if (G.matches.has(n.id) && !anchor) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r + 4 / G.scale, 0, Math.PI * 2);
      ctx.strokeStyle = accent;
      ctx.lineWidth = 1.8 / G.scale;
      ctx.stroke();
    }
  }
  ctx.globalAlpha = 1;

  // ── labels, last so nothing overdraws them
  if (labelled.size) {
    const size = Math.max(9.5, Math.min(13, 11.5 / G.scale));
    ctx.font = '500 ' + size.toFixed(2) + 'px ui-sans-serif, system-ui, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    for (const n of nodes) {
      if (!labelled.has(n.id)) continue;
      const text = n.label.length > 30 ? n.label.slice(0, 30) + '…' : n.label;
      const y = n.y + n.r + 4 / G.scale;
      const width = ctx.measureText(text).width;
      // A soft plate behind the text keeps it readable over dense edges.
      ctx.globalAlpha = 0.72;
      ctx.fillStyle = surf;
      roundRectFill(ctx, n.x - width / 2 - 3 / G.scale, y - 1 / G.scale,
        width + 6 / G.scale, size * 1.25, 3 / G.scale);
      ctx.globalAlpha = 1;
      ctx.fillStyle = (anchor && n === anchor) ? ink : ink2;
      ctx.fillText(text, n.x, y);
    }
  }

  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

/* Which labels to draw: always the focused neighbourhood, otherwise the
   most connected nodes, scaled by how far in you are zoomed. */
function labelSet(nodes, focus, anchor) {
  const set = new Set();
  if (anchor) {
    set.add(anchor.id);
    for (const id of (G.adjacency.get(anchor.id) || [])) set.add(id);
    return set;
  }
  if (G.matches.size) return new Set(G.matches);
  const budget = Math.round(Math.min(nodes.length, 6 + G.scale * 26));
  if (budget <= 0) return set;
  const ranked = nodes.slice().sort((a, b) =>
    (b.degree + (b.weight || 0)) - (a.degree + (a.weight || 0)));
  for (const n of ranked.slice(0, budget)) set.add(n.id);
  return set;
}

function roundRect(ctx, x, y, w, h, r) {
  const rad = Math.min(r, w / 2, h / 2);
  ctx.moveTo(x + rad, y);
  ctx.arcTo(x + w, y, x + w, y + h, rad);
  ctx.arcTo(x + w, y + h, x, y + h, rad);
  ctx.arcTo(x, y + h, x, y, rad);
  ctx.arcTo(x, y, x + w, y, rad);
  ctx.closePath();
}
function roundRectFill(ctx, x, y, w, h, r) {
  ctx.beginPath();
  roundRect(ctx, x, y, w, h, r);
  ctx.fill();
}

function setHud(text) {
  if (text) { $('#graph-hud').textContent = text; return; }
  const nodes = visibleNodes().length;
  const edges = G.edges.filter(e => G.visible.has(e.source.group) && G.visible.has(e.target.group)).length;
  const state = G.alpha > ALPHA_MIN ? 'settling' : 'settled';
  const hidden = G.hideIsolated ? G.nodes.filter(n => n.degree === 0 && G.visible.has(n.group)).length : 0;
  $('#graph-hud').textContent =
    nodes + ' nodes · ' + edges + ' links · ' + Math.round(G.scale * 100) + '% · ' + state +
    (hidden ? ' · ' + hidden + ' unconnected hidden' : '');
}

function renderLegend() {
  const counts = { memory: 0, wiki: 0, document: 0 };
  for (const n of G.nodes) {
    if (G.hideIsolated && n.degree === 0) continue;
    counts[n.group] = (counts[n.group] || 0) + 1;
  }
  const rows = [
    ['memory', 'dot', cssVar('--good', '#34d399'), 'Memories'],
    ['wiki', 'sq', cssVar('--accent', '#9b87ff'), 'Wiki pages'],
    ['document', 'dia', cssVar('--accent-2', '#4dd9e8'), 'Documents'],
  ];
  fill($('#graph-legend'), rows.map(([group, shape, color, label]) =>
    el('div', {
      class: 'leg', role: 'button', tabindex: '0',
      'aria-pressed': String(G.visible.has(group)),
      onclick: () => toggleGroup(group),
      onkeydown: e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggleGroup(group); } },
    },
      el('span', { class: 'leg-sw ' + shape, style: { background: color } }),
      el('span', {}, label),
      el('span', { class: 'leg-n' }, counts[group] || 0))));
}

function toggleGroup(group) {
  if (G.visible.has(group)) G.visible.delete(group); else G.visible.add(group);
  renderLegend();
  G.settled = false;
  graphReheat(0.6);
}

function applyGraphQuery() {
  const q = G.query.trim().toLowerCase();
  G.matches = new Set();
  if (q) {
    for (const n of G.nodes) {
      const hay = (n.label + ' ' + (n.tooltip || '')).toLowerCase();
      if (hay.includes(q)) G.matches.add(n.id);
    }
  }
  graphDraw();
}

/* ── interaction ─────────────────────────────────────────────────── */

const toGraphSpace = event => {
  const rect = G.canvas.getBoundingClientRect();
  const px = event.clientX - rect.left, py = event.clientY - rect.top;
  return { x: (px - G.tx) / G.scale, y: (py - G.ty) / G.scale, px, py };
};

function nodeAt(point) {
  const nodes = visibleNodes();
  const slop = 5 / G.scale;
  for (let i = nodes.length - 1; i >= 0; i--) {
    const n = nodes[i];
    if (Math.hypot(n.x - point.x, n.y - point.y) <= n.r + slop) return n;
  }
  return null;
}

function showTip(node, point) {
  const tip = $('#graph-tip');
  if (!node) { tip.style.display = 'none'; return; }
  const meta = node.meta || {};
  const kindColor = node.color;
  fill(tip,
    el('div', { class: 'tip-kind', style: { color: kindColor } }, node.group),
    // textContent, never markup: tooltips carry raw memory text.
    el('div', {}, node.tooltip || node.label),
    el('div', { class: 'tip-meta' },
      node.group === 'memory' ? 'importance ' + meta.importance + '/10 · ' + meta.category
        : node.group === 'wiki' ? 'version ' + meta.version
        : (meta.chunks || 0) + ' chunks · ' + (meta.origin || 'note'),
      node.degree ? '  ·  ' + node.degree + ' links' : ''));
  tip.style.display = 'block';
  const box = tip.getBoundingClientRect();
  tip.style.left = Math.max(6, Math.min(point.px + 16, G.w - box.width - 8)) + 'px';
  tip.style.top = Math.max(6, Math.min(point.py + 16, G.h - box.height - 8)) + 'px';
}

function openGraphNode(node) {
  if (node.group === 'memory') { showMemoryDetail(node.meta.id); return; }
  if (node.group === 'wiki') { switchView('wiki'); openWikiPage(node.meta.id); return; }
  openDetail('Document', [
    detailRow('Path', node.meta.path, true),
    detailRow('Chunks', String(node.meta.chunks)),
    detailRow('Origin', node.meta.origin || 'note'),
    detailRow('Links', String(node.degree)),
  ], []);
}

function initGraph() {
  const canvas = $('#graph-canvas');
  G.canvas = canvas;
  G.ctx = canvas.getContext('2d');

  new ResizeObserver(() => graphResize()).observe($('#graph-wrap'));

  let downAt = null;

  canvas.addEventListener('pointerdown', event => {
    canvas.setPointerCapture(event.pointerId);
    const point = toGraphSpace(event);
    const node = nodeAt(point);
    downAt = { x: event.clientX, y: event.clientY, node };
    if (node) {
      G.dragging = node;
      G.selected = node;
      graphReheat(0.28);
    } else {
      G.panning = { x: event.clientX - G.tx, y: event.clientY - G.ty };
    }
    canvas.classList.add('grabbing');
  });

  canvas.addEventListener('pointermove', event => {
    if (G.dragging) {
      const point = toGraphSpace(event);
      G.dragging.x = point.x; G.dragging.y = point.y;
      G.dragging.vx = 0; G.dragging.vy = 0;
      showTip(G.dragging, point);
      graphReheat(0.28);
      return;
    }
    if (G.panning) {
      G.tx = event.clientX - G.panning.x;
      G.ty = event.clientY - G.panning.y;
      graphDraw();
      return;
    }
    const point = toGraphSpace(event);
    const node = nodeAt(point);
    canvas.classList.toggle('on-node', Boolean(node));
    if (node !== G.hover) {
      G.hover = node;
      showTip(node, point);
      graphDraw();
    } else if (node) {
      showTip(node, point);
    }
  });

  const endPointer = event => {
    if (downAt && downAt.node && G.dragging) {
      const moved = Math.hypot(event.clientX - downAt.x, event.clientY - downAt.y);
      if (moved < 4) openGraphNode(downAt.node);
    }
    G.dragging = null;
    G.panning = null;
    downAt = null;
    canvas.classList.remove('grabbing');
  };
  canvas.addEventListener('pointerup', endPointer);
  canvas.addEventListener('pointercancel', () => { G.dragging = null; G.panning = null; downAt = null; });

  canvas.addEventListener('pointerleave', () => {
    if (G.dragging || G.panning) return;
    G.hover = null;
    showTip(null);
    graphDraw();
  });

  canvas.addEventListener('dblclick', event => {
    const node = nodeAt(toGraphSpace(event));
    if (node) focusNode(node); else graphFit(true);
  });

  canvas.addEventListener('wheel', event => {
    event.preventDefault();
    const rect = canvas.getBoundingClientRect();
    const mx = event.clientX - rect.left, my = event.clientY - rect.top;
    const factor = Math.pow(1.0015, -event.deltaY);
    const next = Math.min(4, Math.max(0.08, G.scale * factor));
    G.tx = mx - (mx - G.tx) * (next / G.scale);
    G.ty = my - (my - G.ty) * (next / G.scale);
    G.scale = next;
    setHud();
    graphDraw();
  }, { passive: false });

  graphResize();
}

/* ══ Brand mark ════════════════════════════════════════════════════
   Amnis means river. The mark is a few flowing lines, drawn once. */

function drawBrand() {
  const canvas = $('#brand-canvas');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 64, 64);
  ctx.lineCap = 'round';
  ctx.strokeStyle = 'rgba(255,255,255,.92)';
  for (let i = 0; i < 3; i++) {
    const y = 22 + i * 11;
    ctx.globalAlpha = 0.95 - i * 0.22;
    ctx.lineWidth = 4.5 - i * 0.7;
    ctx.beginPath();
    ctx.moveTo(11, y);
    ctx.bezierCurveTo(24, y - 9 + i * 2, 40, y + 9 - i * 2, 53, y);
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ══ Modals, palette, theme ════════════════════════════════════════ */

const openModal = id => $('#' + id).classList.add('open');
const closeModal = id => $('#' + id).classList.remove('open');

const COMMANDS = [
  { icon: '◈', label: 'Go to Dashboard', hint: 'view', run: () => switchView('dashboard') },
  { icon: '✦', label: 'Go to Memories', hint: 'view', run: () => switchView('memories') },
  { icon: '⌕', label: 'Go to Search', hint: 'view', run: () => switchView('search') },
  { icon: '⬡', label: 'Go to Graph', hint: 'view', run: () => switchView('graph') },
  { icon: '▤', label: 'Go to Wiki', hint: 'view', run: () => switchView('wiki') },
  { icon: '◷', label: 'Go to Episodes', hint: 'view', run: () => switchView('episodes') },
  { icon: '⚙', label: 'Go to Maintenance', hint: 'view', run: () => switchView('maintenance') },
  { icon: '＋', label: 'New memory', hint: 'action', run: () => openEditor(null) },
  { icon: '▤', label: 'Compile wiki', hint: 'action', run: () => compileWiki() },
  { icon: '⬡', label: 'Re-layout the graph', hint: 'graph', run: () => { switchView('graph'); graphRelayout(); } },
  { icon: '⤢', label: 'Fit the graph', hint: 'graph', run: () => { switchView('graph'); graphFit(true); } },
  { icon: '⟳', label: 'Refresh current view', hint: 'action', run: () => refreshCurrentView() },
  { icon: '◐', label: 'Toggle theme', hint: 'action', run: () => cycleTheme() },
  { icon: '⚿', label: 'Set API token', hint: 'action', run: () => setApiToken() },
];

let paletteIndex = 0, paletteMatches = COMMANDS;

function openPalette() {
  $('#palette-input').value = '';
  renderPalette('');
  openModal('palette-backdrop');
  setTimeout(() => $('#palette-input').focus(), 50);
}

function renderPalette(query) {
  const needle = query.toLowerCase().trim();
  paletteMatches = COMMANDS.filter(c => !needle || c.label.toLowerCase().includes(needle));
  paletteIndex = 0;
  fill($('#palette-results'), paletteMatches.length
    ? paletteMatches.map((c, i) => el('li', {
        role: 'option', 'aria-selected': String(i === paletteIndex),
        onclick: () => runPaletteItem(i),
        onmouseenter: () => { paletteIndex = i; syncPalette(); },
      }, el('span', { class: 'pi' }, c.icon), el('span', {}, c.label), el('span', { class: 'ph' }, c.hint)))
    : el('li', { 'aria-selected': 'false' }, 'No matching command'));
}

function syncPalette() {
  $$('#palette-results li').forEach((li, i) => li.setAttribute('aria-selected', String(i === paletteIndex)));
}

function movePalette(delta) {
  if (!paletteMatches.length) return;
  paletteIndex = (paletteIndex + delta + paletteMatches.length) % paletteMatches.length;
  syncPalette();
  const items = $$('#palette-results li');
  if (items[paletteIndex]) items[paletteIndex].scrollIntoView({ block: 'nearest' });
}

function runPaletteItem(index) {
  const command = paletteMatches[index];
  closeModal('palette-backdrop');
  if (command) command.run();
}

function setApiToken() {
  const current = localStorage.getItem(TOKEN_KEY) || '';
  const next = prompt('X-Amnis-Token for mutating requests (blank to clear):', current);
  if (next === null) return;
  if (next.trim()) { localStorage.setItem(TOKEN_KEY, next.trim()); toast('Token saved', 'ok'); }
  else { localStorage.removeItem(TOKEN_KEY); toast('Token cleared'); }
}

const THEMES = ['system', 'light', 'dark'];

function applyTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  localStorage.setItem('amnis.theme', theme);
  const button = $('#theme-toggle');
  button.textContent = theme === 'light' ? '☀' : theme === 'dark' ? '☾' : '◐';
  button.title = 'Theme: ' + theme;
  drawBrand();
  if (G.loaded) requestAnimationFrame(graphDraw);
  if (currentView === 'dashboard' && statusCache) renderCategoryChart(statusCache.memory.by_category || {});
}

function cycleTheme() {
  const current = localStorage.getItem('amnis.theme') || 'system';
  applyTheme(THEMES[(THEMES.indexOf(current) + 1) % THEMES.length]);
}

/* ══ Views ═════════════════════════════════════════════════════════ */

const VIEWS = {
  dashboard:   { title: 'Dashboard',   sub: 'Overview of every layer',              load: loadDashboard },
  memories:    { title: 'Memories',    sub: 'Everything Amnis remembers',           load: loadMemories },
  search:      { title: 'Search',      sub: 'Semantic and keyword search over your notes', load: () => {} },
  graph:       { title: 'Graph',       sub: 'How memories, pages and documents relate',    load: () => { if (!G.loaded) loadGraph(); else graphDraw(); } },
  wiki:        { title: 'Wiki',        sub: 'Compiled knowledge pages',             load: loadWiki },
  episodes:    { title: 'Episodes',    sub: 'Logged conversation turns',            load: loadEpisodes },
  maintenance: { title: 'Maintenance', sub: 'Consolidation, pruning, indexing',     load: renderMaintenance },
};

let currentView = 'dashboard';

function switchView(name) {
  if (!VIEWS[name]) return;
  currentView = name;
  $$('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + name));
  $$('.nav-btn').forEach(b => {
    if (b.dataset.view === name) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  $('#view-title').textContent = VIEWS[name].title;
  $('#view-sub').textContent = VIEWS[name].sub;
  if (location.hash !== '#' + name) history.replaceState(null, '', '#' + name);

  if (name === 'graph') {
    // The canvas has no size until the section is displayed, so measure on
    // the next frame — loading before that seeds every node at the origin.
    requestAnimationFrame(() => { graphResize(); VIEWS[name].load(); });
  } else {
    VIEWS[name].load();
  }
}

function refreshCurrentView() {
  if (currentView === 'graph') loadGraph();
  else VIEWS[currentView].load();
  if (currentView !== 'dashboard') loadDashboard();
}

async function compileWiki() {
  toast('Compiling wiki — this can take a while…');
  try {
    const result = await api('/api/compile-wiki', { method: 'POST', body: {} });
    toast('Compiled ' + result.compiled + ' pages', 'ok');
    if (currentView === 'wiki') loadWiki();
    loadDashboard();
  } catch (err) { toast(err.message, 'err'); }
}

/* ══ Wiring ════════════════════════════════════════════════════════ */

function debounce(fn, ms) {
  let timer = null;
  return (...args) => { clearTimeout(timer); timer = setTimeout(() => fn(...args), ms); };
}

function init() {
  applyTheme(localStorage.getItem('amnis.theme') || 'system');
  drawBrand();

  for (const cat of CATEGORIES) {
    $('#mem-category').append(el('option', { value: cat }, cat));
    $('#ed-category').append(el('option', { value: cat }, cat));
  }

  $$('.nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));
  $('#theme-toggle').addEventListener('click', cycleTheme);
  $('#new-memory-btn').addEventListener('click', () => openEditor(null));
  $('#open-palette').addEventListener('click', openPalette);

  $('#mem-search-btn').addEventListener('click', loadMemories);
  $('#mem-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadMemories(); });
  $('#mem-category').addEventListener('change', loadMemories);
  $('#mem-importance').addEventListener('change', loadMemories);
  $('#mem-clear-btn').addEventListener('click', () => {
    $('#mem-search').value = ''; $('#mem-category').value = ''; $('#mem-importance').value = '0';
    loadMemories();
  });

  $('#rag-search-btn').addEventListener('click', doSearch);
  $('#rag-query').addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
  $$('#search-mode button').forEach(b => b.addEventListener('click', () => {
    searchMode = b.dataset.mode;
    $$('#search-mode button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    if ($('#rag-query').value.trim()) doSearch();
  }));

  $('#graph-fit').addEventListener('click', () => graphFit(true));
  $('#graph-relayout').addEventListener('click', graphRelayout);
  $('#graph-refresh').addEventListener('click', loadGraph);
  $('#graph-search').addEventListener('input', debounce(e => {
    G.query = e.target.value;
    applyGraphQuery();
  }, 150));
  $('#toggle-isolated').addEventListener('click', e => {
    G.hideIsolated = !G.hideIsolated;
    e.currentTarget.setAttribute('aria-pressed', String(G.hideIsolated));
    e.currentTarget.textContent = G.hideIsolated ? 'Connected only' : 'Showing all';
    renderLegend();
    G.settled = false;
    graphReheat(0.7);
  });
  $$('#graph-density button').forEach(b => b.addEventListener('click', () => {
    $$('#graph-density button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
    G.limit = Number(b.dataset.limit);
    loadGraph();
  }));

  $('#wiki-search').addEventListener('keydown', e => { if (e.key === 'Enter') loadWiki(); });
  $('#wiki-compile-btn').addEventListener('click', compileWiki);
  $('#wiki-lint-btn').addEventListener('click', async () => {
    try {
      const result = await api('/api/wiki-lint');
      openDetail('Wiki lint', [
        detailRow('Pages checked', String(result.pages_checked)),
        detailRow('Issues found', String(result.issues_found)),
        ...(result.issues || []).slice(0, 40).map(i => detailRow(i.page, i.issue + ' — ' + i.detail)),
      ], []);
    } catch (err) { toast(err.message, 'err'); }
  });

  $('#episode-refresh').addEventListener('click', loadEpisodes);
  $('#episode-session').addEventListener('change', loadEpisodes);
  $('#episode-topic').addEventListener('keydown', e => { if (e.key === 'Enter') loadEpisodes(); });

  $('#ed-save').addEventListener('click', saveMemory);
  $('#ed-importance').addEventListener('input', e => { $('#ed-importance-out').textContent = e.target.value; });

  $$('[data-close]').forEach(b => b.addEventListener('click', () => closeModal(b.dataset.close)));
  $$('.backdrop').forEach(backdrop => backdrop.addEventListener('mousedown', e => {
    if (e.target === backdrop) backdrop.classList.remove('open');
  }));

  const paletteInput = $('#palette-input');
  paletteInput.addEventListener('input', e => renderPalette(e.target.value));
  paletteInput.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); movePalette(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); movePalette(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); runPaletteItem(paletteIndex); }
  });

  document.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); return; }
    if (e.key === 'Escape') {
      const open = $$('.backdrop.open');
      if (open.length) { open.forEach(m => m.classList.remove('open')); return; }
      if (currentView === 'graph' && (G.selected || G.query)) {
        G.selected = null; G.query = ''; $('#graph-search').value = '';
        applyGraphQuery();
      }
      return;
    }
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key === 'n') { e.preventDefault(); openEditor(null); }
    else if (e.key === 'r') { e.preventDefault(); if (currentView === 'graph') graphRelayout(); else refreshCurrentView(); }
    else if (e.key === 'f' && currentView === 'graph') { e.preventDefault(); graphFit(true); }
    else if (e.key === '/') { e.preventDefault(); switchView('search'); $('#rag-query').focus(); }
    else if (e.key >= '1' && e.key <= '7') switchView(Object.keys(VIEWS)[Number(e.key) - 1]);
  });

  window.addEventListener('hashchange', () => {
    const name = (location.hash || '#dashboard').slice(1);
    if (VIEWS[name]) switchView(name);
  });
  // The graph reads theme colours from CSS, so follow an OS theme change.
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    drawBrand();
    if (G.loaded) graphDraw();
    if (statusCache) renderCategoryChart(statusCache.memory.by_category || {});
  });

  initGraph();
  const initial = (location.hash || '#dashboard').slice(1);
  switchView(VIEWS[initial] ? initial : 'dashboard');
  if (initial !== 'dashboard') loadDashboard();
}

document.addEventListener('DOMContentLoaded', init);
</script>
</body>
